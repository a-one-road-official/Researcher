name: Coconala

# ココナラのカテゴリ一覧と各サービス（価格・ランク・評価・販売実績・納期・レビュー本文）を取る（researcher/coconala.py）。
# 入力 researcher/inputs/coconala.csv。push か手動で回る。済んだサービスは飛ばし、時間切れなら自分で次の回を呼ぶ。

# 2026-11-17 課金ガード：起動は手動（workflow_dispatch）だけ。元の起動条件はコメントで残す。
on:
  workflow_dispatch: {}

  # [停止] push:
  # [停止]   branches: [main]
  # [停止]   paths:
  # [停止]     - "researcher/coconala.py"
  # [停止]     - "researcher/inputs/coconala.csv"
permissions:
  contents: write
  # actions: write   # [停止 2026-11-17 課金ガード] 次の回を自分で呼ぶためだけの権限だったので外した

concurrency:
  group: coconala
  cancel-in-progress: false

jobs:
  billing_guard:
    # 2026-11-17 課金ガード：billing_guard.yaml が enabled: true で、このワークフローが allowed_workflows に
    # 載っていて、手動起動（workflow_dispatch）のときだけ、後ろのジョブを動かす。それ以外は即終了。
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: billing_guard.yaml
          sparse-checkout-cone-mode: false
      - id: guard
        env:
          EVENT: ${{ github.event_name }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          wf = os.environ["WF_REF"].split("@")[0].rsplit("/", 1)[-1]
          p = Path("billing_guard.yaml")
          text = p.read_text(encoding="utf-8") if p.exists() else ""
          enabled = re.search(r"(?m)^enabled:\s*true\s*(#.*)?$", text) is not None
          m = re.search(r"(?m)^allowed_workflows:\s*\[([^\]]*)\]", text)
          allowed = [x.strip().strip("'\"") for x in (m.group(1).split(",") if m else []) if x.strip()]
          ok = enabled and wf in allowed and os.environ["EVENT"] == "workflow_dispatch"
          print(f"billing_guard: enabled={enabled} workflow={wf} allowed={allowed} event={os.environ['EVENT']} -> {'RUN' if ok else 'STOP'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"enabled={'true' if ok else 'false'}\n")
          PY

  probe:
    needs: billing_guard
    if: ${{ needs.billing_guard.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 2026-11-17 課金ガード：成功実績から短縮（元 15）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install -q playwright pyyaml
          python -m playwright install --with-deps chromium
      - run: python -u -m researcher.coconala
        env: { COCONALA_PROBE: "1" }

  coconala:
    if: ${{ needs.billing_guard.outputs.enabled == 'true' }}
    needs: [billing_guard, probe]
    runs-on: ubuntu-latest
    timeout-minutes: 76   # 2026-11-17 課金ガード：成功実績から短縮（元 300）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          python -m pip install -q playwright pyyaml
          python -m playwright install --with-deps chromium
      - run: python -u -m researcher.coconala
        env: { COCONALA_SECONDS: "16200" }
      - if: always()
        run: |
          git config user.name "a1-researcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add researcher/out/coconala
          git diff --cached --quiet && exit 0
          git commit -q -m "coconala: $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
      - if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          left=$(python - <<'PY'
          import json,re
          from pathlib import Path
          n=0
          for d in Path("researcher/out/coconala").glob("*"):
              o=d/"order.json"
              if o.exists():
                  ids=json.load(open(o)); n+=sum(1 for i in ids if not (d/"services"/f"{i}.json").exists())
          print(n)
          PY
          )
          echo "left=$left"
          saved=$(cat researcher/out/coconala/saved_last_run.txt 2>/dev/null || echo 0); echo "saved=$saved"
          # [停止 2026-11-17 課金ガード] 次の回を自分で呼ぶのは禁止: if [ "$left" != "0" ] && [ "$saved" != "0" ]; then gh workflow run coconala.yml --ref main; fi
          echo "self re-run disabled by billing guard (left=$left)"
