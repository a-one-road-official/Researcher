name: Researcher

# One research engine for every topic (researcher/topics/*.yaml). Token-free: HTTP,
# headless Chromium, pypdf, tesseract OCR and free multi-engine search. No AI, no paid API.
# On/off lives in researcher/control.yaml. Pushing that file starts a run; each run
# calls the next one itself until the topic is finished or switched off.

# 2026-11-17 課金ガード：起動は手動（workflow_dispatch）だけ。元の起動条件はコメントで残す。
on:
  workflow_dispatch: {}
  # [停止] push:
  # [停止]   branches: [main]
  # [停止]   paths:
  # [停止]     - "researcher/control.yaml"
  # [停止] schedule:
  # [停止]   # 3時間おき（JST 0,3,6,9,12,15,18,21時台）。取り直しの期限が来た品目・顧客だけを回す
  # [停止]   - cron: "*/30 * * * *"

permissions:
  contents: write
  # actions: write   # [停止 2026-11-17 課金ガード] 次の回を自分で呼ぶためだけの権限だったので外した
  # models: read   # [停止 2026-11-17 課金ガード] AI（GitHub Models）を使うコードは無い。課金の入口になりうるので外した

# 2026-11-09 名簿づくり（build）が長い（最大5時間）と、次の回の調査まで止まっていた。build と調査を別々の列にして、調査は待たせない

jobs:
  billing_guard:
    # 2026-11-17 課金ガード：billing_guard.yaml が enabled: true で、このワークフローが allowed_workflows に
    # 載っていて、手動起動（workflow_dispatch）のときだけ、後ろのジョブを動かす。それ以外は即終了。
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: billing_guard.yaml
          sparse-checkout-cone-mode: false
      - id: guard
        env:
          EVENT: ${{ github.event_name }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          wf = os.environ["WF_REF"].split("@")[0].rsplit("/", 1)[-1]
          p = Path("billing_guard.yaml")
          text = p.read_text(encoding="utf-8") if p.exists() else ""
          enabled = re.search(r"(?m)^enabled:\s*true\s*(#.*)?$", text) is not None
          m = re.search(r"(?m)^allowed_workflows:\s*\[([^\]]*)\]", text)
          allowed = [x.strip().strip("'\"") for x in (m.group(1).split(",") if m else []) if x.strip()]
          ok = enabled and wf in allowed and os.environ["EVENT"] == "workflow_dispatch"
          print(f"billing_guard: enabled={enabled} workflow={wf} allowed={allowed} event={os.environ['EVENT']} -> {'RUN' if ok else 'STOP'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"enabled={'true' if ok else 'false'}\n")
          PY

  build:
    needs: billing_guard
    if: ${{ needs.billing_guard.outputs.enabled == 'true' }}
    concurrency: { group: researcher-build, cancel-in-progress: false }
    # list-building step of switched-on topics (e.g. IR1000: screen all listed companies by margin)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pyyaml
      - id: need
        # 2026-11-17 課金ガード：元は pending() が requests 未導入で落ちても todo が空になり、毎回 約90分の名簿づくりが走っていた。
        # 先に依存を入れ、数えられなければこのステップで失敗して止まる（空回りしない）
        run: |
          python -m pip install -q -r researcher/requirements.txt
          todo=$(python -c 'from researcher.build import pending;print(len(pending()))')
          echo "todo=$todo"
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.todo != '0'
        run: |
          python -m pip install -q -r researcher/requirements.txt
          python -m playwright install --with-deps chromium
          python -m researcher.build
      - if: always() && steps.need.outputs.todo != '0'
        run: |
          git config user.name "a1-researcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add researcher/out researcher/inputs
          git diff --cached --quiet && exit 0
          git commit -q -m "researcher: build lists $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done

  plan:
    needs: billing_guard
    if: ${{ needs.billing_guard.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      remaining: ${{ steps.p.outputs.remaining }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pyyaml
      - id: p
        run: |
          J=$(python -m researcher.plan)
          echo "$J"
          echo "matrix=$(echo "$J" | python -c 'import json,sys;print(json.dumps({"include":json.load(sys.stdin)["include"]}))')" >> "$GITHUB_OUTPUT"
          echo "remaining=$(echo "$J" | python -c 'import json,sys;print(json.load(sys.stdin)["remaining"])')" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$J" | python -c 'import json,sys;print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"

  research:
    needs: [billing_guard, plan]
    if: ${{ needs.billing_guard.outputs.enabled == 'true' && (always() && needs.plan.outputs.count != '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install readers (all free)
        run: |
          python -m pip install -q -r researcher/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn poppler-utils
      - name: Research one shard
        run: python -m researcher.run --topic "${{ matrix.topic }}" --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} --limit ${{ matrix.limit }} --out "shard_out/${{ matrix.topic }}/companies"
      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.topic }}-${{ matrix.shard }}
          path: shard_out
          if-no-files-found: ignore
          retention-days: 3

  collect:
    concurrency: { group: researcher-collect, cancel-in-progress: false }
    needs: [billing_guard, plan, research]
    if: ${{ needs.billing_guard.outputs.enabled == 'true' && (always() && needs.plan.outputs.remaining != '0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pyyaml
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: "research-*" }
      - name: Store results and rebuild readable files
        run: |
          shopt -s nullglob
          for d in dl/research-*/*/; do t=$(basename "$d"); mkdir -p "researcher/out/$t/companies"; cp "$d"companies/*.json "researcher/out/$t/companies/" 2>/dev/null || true; done
          for t in researcher/out/*/; do n=$(basename "$t"); [ "$n" = brief ] && continue; [ -f "researcher/topics/$n.yaml" ] || continue; python -m researcher.merge "$n" || echo "merge $n failed"; done
          python -m researcher.scan || true
          python -m researcher.health || true
          python -m researcher.brief
          # 2026-11-09 決めきれない会社だけ別のAI（GitHub Models の無料枠・課金なし）で判定を埋める
          python -m pip install -q requests
          echo "AI判定は停止中：qwen2.5:7b は日本総代理店ありの会社まで余地ありにした（2026-11-09）。判定はClaudeが引用を読んで決める"
          # 走査の計算（AIが書いた計算プログラム）。トークンを使わずに毎回回す
          mkdir -p researcher/calc
          for f in researcher/calc/*.py; do python -I "$f" || echo "calc failed: $f"; done
      - name: Commit
        run: |
          git config user.name "a1-researcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p researcher/out && git add -A researcher/out
          git diff --cached --quiet && exit 0
          git commit -q -m "researcher: results $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: Call the next run while work remains and the switch is on
        # 2026-11-17 課金ガード：次の回を自分で呼ぶのは禁止。このステップは動かない
        if: ${{ false }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git pull -q --rebase || true
          python -m pip install -q pyyaml
          LEFT=$(python -c 'import json,subprocess;print(json.loads(subprocess.check_output(["python","-m","researcher.plan"]))["remaining"])')
          echo "remaining=$LEFT"
          if [ "$LEFT" != "0" ]; then gh workflow run researcher.yml --ref main; fi
