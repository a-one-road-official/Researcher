name: X pain

# X（旧Twitter）の公式APIで、ものづくりの現場の困りごとの投稿を集め、深さの5つの印で仕分ける（researcher/x_pain.py）。
# 有料API（1投稿ごとに課金）。読み取り数の上限は researcher/control.yaml の x_pain.max_posts_per_run。
# トークンは GitHub の Secrets の X_BEARER_TOKEN。無ければ何もせず終わる。オン・オフは control.yaml の x_pain.run。

# 2026-11-17 本人「Usageをunder controlしろ」：control.yaml を触るたびに有料APIが回っていたので push 起動を外した。定期1日1回＋手動だけ
on:
  # 2026-11-24 課金の止め：自動の起動（schedule・push・pull_request など）は外した。手動（workflow_dispatch）だけ。消さずにコメントで残す
  workflow_dispatch: {}
  # schedule:
  #   - cron: "17 0 * * *"   # 1日1回 JST 9:17（直近7日の検索なので1日1回で取りこぼさない。2026-11-16 本人：最小資源最大成果）

permissions:
  contents: write

concurrency:
  group: x_pain
  cancel-in-progress: false

jobs:
  x_pain:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 2026-11-24 30→10（100件は数分）
    steps:
      # 2026-11-24 billing_guard（共通の止めスイッチ）：既定の枝の billing_guard.yaml が enabled: true でなければ、何もせずここで止める。true にするのは本人の指示があったときだけ
      - name: billing_guard（共通の止めスイッチ）を読む
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: billing_guard.yaml
          sparse-checkout-cone-mode: false
          path: .billing_guard
      - name: billing_guard（共通の止めスイッチ）が false なら止める
        run: |
          if ! grep -Eq '^enabled:[[:space:]]*true[[:space:]]*(#.*)?$' "$GITHUB_WORKSPACE/.billing_guard/billing_guard.yaml" 2>/dev/null; then
            echo "::error::billing_guard.yaml が enabled: true ではないので、何もせずに止めた（課金の止めスイッチ・2026-11-24）"
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/.billing_guard"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q requests pyyaml
      - run: python -m researcher.x_pain
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - run: |
          git config user.name "a1-researcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add researcher/out/x_pain
          git diff --cached --quiet && exit 0
          git commit -q -m "x_pain: $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
