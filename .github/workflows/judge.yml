name: Judge
# 2026-11-09 AI判定。GitHub Models は 2026-07-30 に廃止済みのため、作業機の中で無料の公開モデル（Ollama, qwen2.5:7b）を動かす。
# キー・課金・外部AIサービスなし。調査の回（collect）の最後に呼ばれる。手動でも回せる
# 2026-11-17 課金ガード：起動は手動（workflow_dispatch）だけ。元の起動条件はコメントで残す。
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: researcher-judge, cancel-in-progress: false }
jobs:
  billing_guard:
    # 2026-11-17 課金ガード：billing_guard.yaml が enabled: true で、このワークフローが allowed_workflows に
    # 載っていて、手動起動（workflow_dispatch）のときだけ、後ろのジョブを動かす。それ以外は即終了。
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: billing_guard.yaml
          sparse-checkout-cone-mode: false
      - id: guard
        env:
          EVENT: ${{ github.event_name }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          wf = os.environ["WF_REF"].split("@")[0].rsplit("/", 1)[-1]
          p = Path("billing_guard.yaml")
          text = p.read_text(encoding="utf-8") if p.exists() else ""
          enabled = re.search(r"(?m)^enabled:\s*true\s*(#.*)?$", text) is not None
          m = re.search(r"(?m)^allowed_workflows:\s*\[([^\]]*)\]", text)
          allowed = [x.strip().strip("'\"") for x in (m.group(1).split(",") if m else []) if x.strip()]
          ok = enabled and wf in allowed and os.environ["EVENT"] == "workflow_dispatch"
          print(f"billing_guard: enabled={enabled} workflow={wf} allowed={allowed} event={os.environ['EVENT']} -> {'RUN' if ok else 'STOP'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"enabled={'true' if ok else 'false'}\n")
          PY

  judge:
    needs: billing_guard
    if: ${{ needs.billing_guard.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 52   # 2026-11-17 課金ガード：成功実績から短縮（元 180）
    services:
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pyyaml requests
      - name: 無料モデルを作業機に入れる（公式のDockerイメージ）
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:11434/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:11434/api/pull -d '{"model":"qwen2.5:7b","stream":false}' | tail -c 300
          curl -sf http://localhost:11434/api/tags | head -c 300
      - run: python -m researcher.judge_ai
        env:
          JUDGE_MINUTES: "150"
      - if: always()
        run: |
          git config user.name "a1-researcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add researcher/out
          git diff --cached --quiet && exit 0
          git commit -q -m "researcher: AI判定 $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done  # 判定の結果を優先（途中で調査の回が書いても判定を失わない）
