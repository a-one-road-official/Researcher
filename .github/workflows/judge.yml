name: Judge
# 2026-11-09 AI判定だけを単独で回す（調査の回を待たない）。GitHub Models の無料枠、課金なし
on:
  workflow_dispatch: {}
permissions:
  contents: write
  models: read
concurrency: { group: researcher-collect, cancel-in-progress: false }
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pyyaml requests
      - run: python -m researcher.judge_ai
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "a1-researcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add researcher/out
          git diff --cached --quiet && exit 0
          git commit -q -m "researcher: AI判定 $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
