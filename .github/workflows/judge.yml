name: Judge
# 2026-11-09 AI判定。GitHub Models は 2026-07-30 に廃止済みのため、作業機の中で無料の公開モデル（Ollama, qwen2.5:7b）を動かす。
# キー・課金・外部AIサービスなし。調査の回（collect）の最後に呼ばれる。手動でも回せる
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: researcher-judge, cancel-in-progress: false }
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      ollama:
        image: ollama/ollama:latest
        ports: ["11434:11434"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pyyaml requests
      - name: 無料モデルを作業機に入れる（公式のDockerイメージ）
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:11434/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:11434/api/pull -d '{"model":"qwen2.5:7b","stream":false}' | tail -c 300
          curl -sf http://localhost:11434/api/tags | head -c 300
      - run: python -m researcher.judge_ai
        env:
          JUDGE_MINUTES: "150"
      - if: always()
        run: |
          git config user.name "a1-researcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add researcher/out
          git diff --cached --quiet && exit 0
          git commit -q -m "researcher: AI判定 $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
