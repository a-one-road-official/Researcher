# 狙い目の業界（樹脂以外の3Dプリンティング国内プレイヤー）1社ずつの「お金の流れ」図の下書き。
# 5つの欄ごとに根拠の行をそのまま引用し、sheet.csv に「案（引用）」として並べる。図に起こすのは本人。
title: 非樹脂3DP 国内プレイヤー お金の流れ（誰から→この会社→誰に・いつ・いくら）
input: researcher/inputs/am_trade.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  設立: [設立, 創業, 創立]
  従業員数: [従業員, 社員数, 従業者]
  売上高: [売上高, 売上, 年商]
  事業内容: [事業内容, 事業概要, 営業品目, 業務内容, 取扱品目]
  取引先: [主要取引先, 取引先, 仕入先, 販売先, 納入先]

evidence:
  誰から: [総代理店, 日本代理店, 正規代理店, 販売代理店, 代理店契約, 独占販売, 国内販売権, 輸入, 取扱メーカー, 取扱ブランド, 提携, 自社開発, 自社製, 製造元, 開発元, distributor, reseller, partner]
  何をする: [輸入販売, 販売, 受託, 造形サービス, 受託造形, 試作, レンタル, リース, 保守, 技術サポート, 教育, トレーニング, 講習, セミナー, コンサル, 開発支援, 設計]
  誰に: [顧客, お客様, 納入実績, 導入実績, 導入事例, 導入先, 取引先, 販売先, 業界, ユーザー]
  お金の形: [月額, 年額, 年間保守, 保守契約, 保守料, サブスク, ライセンス, 消耗品, 粉末, 材料費, 見積, 都度, 1個から, 初期費用, リース料, レンタル料, 料金, 価格]
  いくら: [円, 万円, 税込, 税別, USD, ドル, ユーロ]
numeric: [いくら]

sheet:
  - [1 誰から, 誰から]
  - [2 この会社が何をする, 何をする]
  - [3 誰に, 誰に]
  - [4 いつ・どんな形でお金が動く, お金の形]
  - [5 いくら, いくら]

subpage_keywords: [会社概要, 会社案内, 企業情報, 事業, 製品, 取扱, サービス, 料金, 価格, 保守, サポート, 導入事例, 事例, 実績,
  ニュース, お知らせ, プレス, 代理店, パートナー, 沿革, company, about, profile, product, service, price, pricing, case,
  news, partner, support, pdf]
image_keywords: [料金, 価格, price, 事例, case, 取引, 実績, 沿革, history]

external_queries:
  - "{name} 代理店 契約"
  - "{name} 導入事例"
  - "{name} 価格 OR 料金"
  - "{name} 受託 造形"

limits: {pages: 30, subpages: 25, pdfs: 8, images: 10, external_per_query: 3}
