# 本人の指示（2026-11-04）：顧客1社ごとに顧客起点の3C＋PEST。業界（frame_export／frame_import）の上に重ねる。
# 1社につき、本人の会社情報に加えて、顧客の顧客（主要取引先・発注元）・顧客の競合・顧客が力を入れていること・課題を一次情報（有報・中計・決算資料・調達方針・採用・社長発言）から引用。
# 新しい顧客は inputs/customer_3c.csv に1行足すだけで回り始める。24時間ごとに取り直して足していく（消さない）。
