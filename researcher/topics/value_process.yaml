# 2026-11-06 軸に合わせて品目を直す：痛み・損（深さの印）の欄と検索を先頭に足した。
# 本人の指示（2026-11-04）：①キーエンスが超高付加価値の新製品を作るプロセス（ニーズの集め方・商品企画・値付け）②大型ディールを決める企業向け営業の型（製品の「できる・できない」の線引き＋顧客の変革プロセス＋5か年ROI）③ものづくり企業の設計〜製造プロセスのどこが置き換えられるか、を公開情報だけで取る。
# キャディについては公開情報（決算・IR・採用ページ・公開インタビュー）だけを使う。在籍中に知った社内情報は使わない（本人の倫理の線）。引用のまま。要約しない。
kind: market
title: 高付加価値の作り方と大型ディールの型・ものづくり企業の工程ごとの置き換え余地
input: researcher/inputs/value_process.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  痛み・損（深さの印）: [受注を断, 断った, 断らざるを得, 失注, 機会損失, 稼働停止, 設備が止, ライン停止, 納期遅れ, 受注残, 人手不足倒産, 倒産, 廃業, 欠員, 採用できなかった, 応募がない, 離職, 損失額, 被害額, 億円の損失, 減産, 操業停止, turned down orders, lost orders, backlog, labor shortage, shutdown]
  仕組み・プロセス: [仕組み, プロセス, 手順, 流れ, ステップ, 段階, 方法, ニーズカード, 商品企画, 企画会議]
  ニーズの集め方: [ニーズ, 潜在ニーズ, 顧客の声, ヒアリング, 現場, 困りごと, 要望, 訪問]
  値付け・付加価値: [付加価値, 値付け, 価格, 粗利率, 営業利益率, 経済価値, 費用対効果, ROI, 削減効果]
  できる・できない: [できること, できないこと, 対象外, 適用範囲, 制約, 前提条件, 向いている, 向いていない]
  導入・変革: [導入, 変革, 業務改革, 5年, 中期, 投資回収, 効果, 年間, 削減]
  工程・担当: [設計, 構想設計, 詳細設計, 見積, 調達, 購買, 生産技術, 製造, 検査, 品質保証, 出荷, 保守, 担当者, 部門]
  工程の時間と費用: [時間, 工数, リードタイム, 日数, コスト, 費用, 人件費, 割合, "%"]

external_queries:
  - "{name} 人手不足 受注 断る"
  - "{name} 受注残 人手不足"
  - "{name} 人手不足 損失 億円"
  - "{name}"
  - "{name} 仕組み 解説"
  - "{name} インタビュー"
  - "{name} 事例"
  - "{en}"

limits: {pages: 45, external_per_query: 6, per_cat: 15}
