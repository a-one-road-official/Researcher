# 2026-11-06 軸に合わせて品目を直す：痛み・損（深さの印）の欄と検索を先頭に足した。
# 本人の指示（2026-11-03）：「製造業」「中小製造業」で括らない。企業規模・職種・業種・地域でセグメントを分けた採用コストと採用状況を取る。
# 規模別・職種別・業種別の数字が出ている一次調査（マイナビ・リクルート・doda・エン・厚労省・中小企業白書・商工会議所・帝国データバンク等）から引用のまま取る。要約しない。
kind: market
title: 製造業の採用コストと採用状況 — 企業規模・職種・業種・地域のセグメント別
input: researcher/inputs/mfg_hiring_seg.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  痛み・損（深さの印）: [受注を断, 断った, 断らざるを得, 失注, 機会損失, 稼働停止, 設備が止, ライン停止, 納期遅れ, 受注残, 人手不足倒産, 倒産, 廃業, 欠員, 採用できなかった, 応募がない, 離職, 損失額, 被害額, 億円の損失, 減産, 操業停止, turned down orders, lost orders, backlog, labor shortage, shutdown]
  セグメント定義: [従業員, 規模別, 人以下, 人未満, 人以上, 1〜29人, 30〜99人, 100〜299人, 300〜999人, '1,000人以上', 職種別, 業種別, 地域別, 都道府県別]
  採用単価: [採用単価, 1人あたり, 一人当たり, 採用コスト, 採用費, 万円, cost per hire]
  年間採用費: [年間採用費, 採用予算, 採用にかけた, 総額, 広告費, 求人広告費, 紹介手数料]
  採用経路: [ハローワーク, 求人広告, 人材紹介, リファラル, 縁故, 学校, 自社サイト, Indeed, 求人ボックス, 経路別]
  充足・欠員: [充足率, 欠員, 未充足, 採用できなかった, 計画比, 人手不足, 有効求人倍率, 不足感]
  調査主体・時期: [調査, 白書, 年版, 年度, 発表, 実施, 回答, 社を対象, n=]

numeric: [採用単価, 年間採用費]

figure_patterns:
  万円: '採用単価|(\d{1,4}(?:\.\d)?)\s*万円'

external_queries:
  - "{name} 人手不足 受注 断る"
  - "{name} 受注残 人手不足"
  - "{name} 人手不足 損失 億円"
  - "{name} 採用単価 規模別"
  - "{name} 採用コスト 調査 万円"
  - "{name} 中途採用状況調査 従業員規模別"
  - "{name} 採用経路 割合 調査"
  - "{name} 人手不足 充足率 調査 2025"
  - "{name} 白書 採用"

limits: {pages: 50, external_per_query: 6, per_cat: 15}
