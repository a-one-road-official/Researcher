# ④顧客目線A：社長が一人で決める会社（業種別）— 前受けで軽いソフト・卓上3Dプリンターを買える層。整備工場・ガソリンスタンドはDに分離（MECE）
# 正本：docs/customer_eye_4-spec-2026-11-15.md（2026-11-15 田村指示「④顧客目線の調査（MECE）」）
# 設計：docs/customer_eye_4-gap-design-2026-11-15.md（前の出力の失敗型への対応）
# 項目対応：証拠の区分＝仕様の項目1〜9＋この層固有の区分。項目10は集計時に空の区分から質問の形で作る。
# 数字は出典つきで取る。1ソースの数字は第2段で突き合わせるまで確定扱いしない。
kind: market
title: ④顧客目線A：社長が一人で決める会社（業種別）— 前受けで軽いソフト・卓上3Dプリンターを買える層。整備工場・ガソリンスタンドはDに分離（MECE）
input: researcher/inputs/customer_eye_a.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  項目1_分母: [事業所数, 企業数, 従業者数, 経済センサス, 業界団体, 会員数, 個人事業主, 開業率, 廃業率]
  項目2_払う困りごと: [人手不足, 後継者不足, 集客, 売上減少, 原価高騰, 手作業, アナログ, DX, 困りごと, 課題]
  項目3_目の高さ: [代表者インタビュー, 社長インタビュー, 経営者インタビュー, 密着, 一日の仕事, 現場ルポ, ブログ]
  項目4_比較相手: [シェア, 導入シェア, 料金プラン, プラン比較, 乗り換え, 選ばれる]
  項目5_選ばれない理由: [解約, 解約率, 不満, 使いにくい, 高い, サポート, 口コミ, レビュー, 失敗]
  項目6_聞いてくること: [よくある質問, FAQ, 導入相談, 無料トライアル, お問い合わせ]
  項目7_払う額: [月額, 年額, 初期費用, 導入費用, 価格, 料金, 万円]
  項目8_導入後の変化: [導入事例, 導入企業, 削減, 効率化, 時間短縮, 売上アップ, 成功事例]
  項目9_決め方: [代表取締役, 社長自ら, 個人事業主, IT導入補助金, 小規模事業者持続化補助金, リース, 前払い]
  項目A_買っている道具: [3Dプリンター, 光造形, FDM, CAD, POSレジ, 予約システム, 会計ソフト, 販売管理]

numeric: [項目1_分母, 項目7_払う額]

figure_patterns:
  事業所数: '項目1_分母|(?:事業所数|企業数)[^0-9]{0,20}?([\d,]+)\s*(?:事業所|社|件)'
  従業者数: '項目1_分母|(?:従業者数|従業員数)[^0-9]{0,20}?([\d,]+)\s*人'
  金額_万円: '項目7_払う額|([\d,]+)\s*万円'
  月額_円: '項目7_払う額|月額[^0-9]{0,10}?([\d,]+)\s*円'

external_queries:
  - "{name} 事業所数 経済センサス 従業者数 統計"
  - "{name} 業界団体 会員数 加盟店数"
  - "{name} 社長 インタビュー 人手不足 後継者 課題"
  - "{name} 3Dプリンター 導入事例 価格 小規模"
  - "{name} ソフト 月額 導入 IT導入補助金"
  - "{en} small business owners statistics establishments employees spending software"

limits: {pages: 40, external_per_query: 5, per_cat: 15}
