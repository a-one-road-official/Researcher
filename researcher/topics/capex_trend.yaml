# 本人の指示（2026-11-06）：「機械への設備投資が今年60%みたいなやつの変遷もさぐれ」。
# 設備投資を実施・計画する企業の割合と金額、機械（工作機械・産業機械）の受注を、年ごとの推移で取る。規模別・業種別を優先（「製造業」で括らない）。
# 一次を優先：日本政策金融公庫 中小製造業設備投資動向調査（毎年・実施割合・目的別）、商工中金 中小企業設備投資動向調査、日本銀行 短観 設備投資計画（規模別）、
# 日本政策投資銀行 設備投資計画調査、財務省 法人企業統計 設備投資（規模別）、日本工作機械工業会 工作機械受注（内需・業種別）、日本産業機械工業会 受注、内閣府 機械受注統計。
# 目的別（能力増強・更新・省力化・合理化）の割合の推移も取る（人手不足が投資の理由になっているかの材料）。引用のまま。要約しない。
kind: market
title: 設備投資の実施割合・金額・機械受注の推移（規模別・業種別・目的別）
input: researcher/inputs/capex_trend.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈, url: 直接URL}
refresh_hours: 168

evidence:
  実施割合・計画割合: [実施割合, 実施企業割合, 設備投資を実施, 実施した企業, 計画割合, 計画している, 実施予定, 投資を行う, '%']
  金額・前年比: [設備投資額, 投資額, 億円, 百万円, 万円, 前年比, 前年度比, 増加, 減少, 伸び率]
  規模別・業種別: [規模別, 従業員, 人以下, 人以上, 中小企業, 中堅企業, 大企業, 業種別, 金属製品, 一般機械, はん用, 生産用, 輸送用, 電気機械]
  目的別: [能力拡充, 能力増強, 更新, 維持補修, 合理化, 省力化, 省人化, 自動化, 新製品, 研究開発, 人手不足, DX, デジタル, 脱炭素]
  機械受注: [工作機械受注, 受注額, 内需, 外需, 機械受注, 船舶・電力を除く, 産業機械受注, 一般機械]
  推移: ["2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026", 推移, 時系列, 年度, 過去最高, 過去最低]
  調査主体・時期: [調査, 年度, 公表, 実施, 回答, 社を対象, n=, 日本政策金融公庫, 商工中金, 日本銀行, 短観, 政策投資銀行, 法人企業統計, 工作機械工業会]

numeric: [実施割合・計画割合, 金額・前年比, 機械受注]

external_queries:
  - "{name} 推移"
  - "{name} 調査結果 pdf"
  - "{name} 年度 実施割合"
  - "{en}"
limits: {pages: 55, pdfs: 14, external_per_query: 6, per_cat: 20}
