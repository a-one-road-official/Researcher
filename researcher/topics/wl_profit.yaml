# 第2段（2026-11-03 洗い直し）：ホワイトラベルの可否を「明言」「OEM・組込み」「再販制度」に分けて引用する。
# 第1段（wl_field6・wl_abc）で名前が出たホワイトラベル候補の提供企業を1社ずつ三重確認する。
# 本人の条件：ホワイトラベルで儲かっていて黒字の製品のみ。黒字・売上・資金調達・存続（清算・買収）・自社名で出せる条件の事実だけを引用する。
title: ホワイトラベル候補の提供企業 — 黒字・売上・存続・再販条件
input: researcher/inputs/wl_profit.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  創業年度: [設立, 創業, 創立, 設立年, 創業年, Founded, Established, founded in, year founded]
  株主: [株主, 主要株主, 大株主, 株主構成, 出資者, 親会社, Shareholders, Ownership, Owner, Parent company, Investors]
  設立: [Founded, Established, founded in, 設立, 創業]
  従業員数: [Employees, Team size, employees, 従業員]
  所在地: [Headquarters, Location, HQ, 所在地]
  売上高: [Revenue, ARR, Turnover, 売上]
  代表者: [CEO, Founder, Co-founder, 代表]

evidence:
  株主構成: [株主, 大株主, 主要株主, 株主構成, 出資比率, 持株比率, 持株, 親会社, 資本提携, 出資, 筆頭株主, shareholder, shareholding, ownership, owned by, stake in, majority stake, parent company, subsidiary of, investors include, backed by, Gesellschafter]
  創業年度: [設立, 創業, 創立, 年に設立, 年創業, founded in, established in, was founded, since 19, since 20]
  黒字・収益性: [profitable, profitability, profit, EBITDA, net income, net loss, operating income, cash-flow positive, cash flow positive, break-even, breakeven, bootstrapped, self-funded, Jahresüberschuss, Gewinn, Verlust, pelnas, nuostolis, 黒字, 赤字, 営業利益, 純利益]
  売上: [revenue, ARR, turnover, sales, Umsatz, pajamos, 売上]
  資金調達: [raised, funding, Series A, Series B, seed, investment, investor, valuation, 資金調達]
  存続: [liquidation, insolvency, bankruptcy, shut down, closed, ceased, acquired, acquisition, merged, Insolvenz, bankrotas, 清算, 破産, 買収]
  ホワイトラベル明言: [white label, white-label, whitelabel, white labeled, white-labelled, rebrand, rebranding, your own brand, your brand, your logo, your domain, custom domain, custom branding, private label, unbranded, remove our branding, powered by, ホワイトラベル, 自社ブランドで]
  OEM・組込み: [OEM, embed, embedded, SDK, API, license our technology, licensing, toolkit, integrate into your, OEM提供, 組込み]
  再販制度: [reseller, resell, partner program, channel partner, distributor, VAR, value-added reseller, referral partner, 代理店, 再販]
  日本対応: [Japan, Japanese, 日本, 日本語, distributor]
  顧客: [customers, clients, case study, used by, trusted by, 導入]

subpage_keywords: [about, company, team, partner, partners, reseller, white, oem, api, pricing, press, news, blog, careers, investors, customers, case, legal, imprint, impressum]
image_keywords: [team, about, partner]

external_queries:
  - "{name} 株主 OR 大株主 OR 出資比率 OR 親会社"
  - "{name} shareholders ownership investors parent company"
  - "{name} 設立 OR 創業 OR founded"
  - "{name} revenue profitable"
  - "{name} EBITDA net income annual report"
  - "{name} funding raised"
  - "{name} acquired OR liquidation OR insolvency OR closed"
  - "{name} white label"
  - "{name} rebrand OR \"your own brand\" OR \"your logo\" OR \"private label\""
  - "{name} OEM SDK licensing partners"
  - "{name} reseller partner program"
  - "{name} Jahresabschluss OR financial statements"
  - "{name} Japan"
  - "{name} employees revenue crunchbase OR dealroom OR northdata"

limits: {pages: 30, subpages: 25, pdfs: 8, images: 6, external_per_query: 4}
