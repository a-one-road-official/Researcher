# 本人の指示（2026-11-03）：3つの選択肢を数字で比べてからビジネスモデルを決める。①Yomi継続 ②卓上金属3Dプリンターを担いで日本で売る ③ホワイトラベルのソフトを受託開発の会社に売る。
# 各選択肢の「売り先の数（規模別）・単価の相場・代理店や再販の取り分・補助金・競合」を引用のまま取る。「製造業」「中小製造業」で括らず、規模・業種で分かれた数字を優先する。
kind: market
title: 3つの選択肢の市場の前提 — 売り先の数・単価・取り分・補助金・競合
input: researcher/inputs/biz3_market.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  売り先の数: [事業所数, 企業数, 社数, 従業員規模別, 規模別, 産業分類, 経済センサス, 工業統計, number of companies, establishments]
  単価・価格: [価格, 料金, 月額, 年額, 初期費用, 万円, 円, price, per month, USD]
  取り分・マージン: [マージン, 仕切り, 卸値, 代理店手数料, 紹介料, 粗利, margin, discount, commission, reseller]
  市場規模・台数: [市場規模, 億円, 出荷台数, 導入台数, 販売台数, market size, units]
  補助金: [補助金, 補助率, 補助上限, 省力化投資補助金, ものづくり補助金, IT導入補助金, 採択]
  競合: [サービス, 提供, 導入事例, 主要企業, 比較, 一覧, ランキング]
  導入期間・キャッシュ: [導入期間, 納期, リードタイム, 前払い, 支払条件, 検収, 回収, 契約期間]

numeric: [単価・価格, 市場規模・台数]

external_queries:
  - "{name}"
  - "{name} 料金 相場"
  - "{name} 規模別 社数"
  - "{name} 比較 一覧"
  - "{en}"
  - "{name} 2025 OR 2026"

limits: {pages: 50, external_per_query: 6, per_cat: 15}
