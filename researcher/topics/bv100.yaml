# 本人の指示（2026-11-05）：ベストベンチャー100（イシン主催）の2016〜2026年度の選出企業を全部洗い、各社の領域を
# 経済センサス（日本標準産業分類）の構造でMECEに分け、領域ごとの社数を出す。業種はキーワードで付けない：
# 事業内容・売上の柱を公式サイトの会社概要から引用で残し、分類はその引用を読んで決める。創業年度・株主構成は必須。
# 本人の指示（20:38）：見る業界は「ベンチャー自身が何屋か（IT・広告）」ではなく「どの産業を相手にしているか」（製造・物流・農業…）。
# サイトの業界タグ（IT・Web 28／広告15／不動産16…）は使えない。導入事例・主要取引先・客の業種を引用で取り、それを読んで大分類に分ける。
# 全業種向け（横断）と個人向け（BtoC）は別の箱にしてMECEを保つ。
title: ベストベンチャー100 選出企業（2016〜2026）— 事業内容・資本金・設立・株主（産業分類の材料）
build: researcher.build_bv100
input: researcher/inputs/bv100.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  事業内容: [事業内容, 事業概要, 事業領域, サービス, 主な事業]
  資本金: [資本金]
  創業年度: [設立, 創業, 創立]
  従業員数: [従業員, 社員数, 従業者]
  売上高: [売上高, 売上, 年商]
  株主: [株主, 主要株主, 出資, 資本提携, 引受先]
  所在地: [所在地, 本社, 住所]
  代表者: [代表者, 代表取締役]
  主要取引先: [主要取引先, 取引先, 導入企業]

evidence:
  売上の柱（何で稼ぐか）: [事業内容, 売上, 収益, 主力, 手数料, 月額, 利用料, 請負, 受託, 販売, 仲介, 紹介, 派遣, 製造, 運営]
  客は誰か: [法人向け, 個人向け, BtoB, BtoC, 中小企業, 大手企業, 業界向け, 業界特化, 業種を問わず, 全業種]
  客の産業（導入事例・取引先）: [導入事例, 導入企業, 導入実績, お客様の声, 主要取引先, 取引実績, 顧客, クライアント, 製造業, メーカー, 工場, 物流, 運送, 倉庫, 農業, 農家, 漁業, 建設, 工務店, ゼネコン, 不動産, 医療, 病院, クリニック, 介護, 歯科, 薬局, 飲食, 宿泊, ホテル, 小売, 卸, 商社, 金融, 銀行, 保険, 教育, 学校, 塾, 自治体, 官公庁, エネルギー, 電力, 美容, 士業, IT企業]
  資本金・株主: [資本金, 株主, 出資, 第三者割当, 資金調達, ベンチャーキャピタル, 上場, 子会社]
  選出の記録: [ベストベンチャー100, 選出]

figure_patterns:
  資本金(万円): "資本金・株主|資本金\\s*[:：]?\\s*([\\d,\\.]+)\\s*万円"
  資本金(億円): "資本金・株主|資本金\\s*[:：]?\\s*([\\d,\\.]+)\\s*億"

subpage_keywords: [会社概要, 会社情報, 企業情報, 事業内容, サービス, 導入事例, 事例, お客様の声, 実績, 取引先, 沿革, about, company, service, case, works, clients, corporate]
image_keywords: [概要]

external_queries:
  - "{name} 会社概要 資本金 設立"
  - "{name} 事業内容 売上"
  - "{name} 資金調達 株主"
  - "{name} 導入事例"
  - "{name} 主要取引先"

limits: {pages: 14, subpages: 12, pdfs: 2, images: 2, external_per_query: 3}
