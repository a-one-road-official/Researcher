# 本人の指示（2026-11-06）：「製造業は技術者と高卒の採用に本当に困っている」をもっと広く深く確かめる（ググり散らかす）。
# 「製造業」で一括りにしない：職種別（金属加工・溶接、機械整備、検査、組立など）× 企業規模別 × 地域（京浜）で分ける。
# 困りごとの深さ（受注を断った・納期が延びた・倒産した・求人を出し続けて埋まらない）を数字で取る。引用のまま取る。
kind: market
title: 製造業の採用の困りごと — 職種別の求人倍率・高卒求人倍率・充足率・採用できず起きたこと（受注辞退・納期遅れ・倒産）、規模別・地域別
input: researcher/inputs/mfg_hiring_pain.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  求人倍率・充足率: [有効求人倍率, 新規求人倍率, 求人倍率, 充足率, 欠員率, 未充足, 応募ゼロ, 応募者数]
  高卒・技術者: [高卒, 高校新卒, 技術者, 技能者, 技能職, 工業高校, 新卒, 中途]
  採用できず起きたこと: [受注を断, 受注辞退, 機会損失, 納期の延長, 納期遅れ, 事業の縮小, 倒産, 廃業, 残業の増加, 外注]
  規模別: [従業員, 人以下, 中小企業, 小規模, 大企業, 資本金]
  地域別: [神奈川, 東京, 大田区, 川崎, 横浜, 京浜, 愛知, 全国]
  採用にかけるお金: [採用単価, 採用費, 求人広告費, 紹介手数料, 一人当たり, 万円]
  出典の種類: [労働局, 厚生労働省, 一般職業紹介状況, 帝国データバンク, 東京商工リサーチ, 商工会議所, 信用金庫, 白書, 調査]

numeric: [求人倍率・充足率, 採用にかけるお金]

external_queries:
  - "{name} 有効求人倍率 職業別 労働局 2026"
  - "{name} 人手不足 調査 2025 2026 製造業 割合"
  - "{name} 採用できない 受注を断った 割合"
  - "{name} 高卒求人倍率 製造業 工業高校"
  - "{name} 採用単価 製造業 中小企業"
  - "site:jsite.mhlw.go.jp {name} 職業別 有効求人倍率"

limits: {pages: 40, external_per_query: 6, per_cat: 15}
