# am_users：A1の営業リスト。ipros_allを母集団に、取扱製品（一点物・少量多品種 × AM適合の製品/素材）で選ぶ。
# 選定条件の正本：docs/am_users-criteria-2026-11-11.md（2026-11-11 本人と擦り合わせ済み）
title: AM営業リスト am_users（取扱製品ベース選定）
input: researcher/inputs/am_users.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  所在地: [所在地, 本社, 住所]
  事業内容: [事業内容, 事業概要, 営業品目, 業務内容, 取扱品目, 事業]
  代表者: [代表者, 代表取締役, 社長, 代表]
  従業員数: [従業員, 社員数, 従業者, 人員]
  売上高: [売上高, 売上, 年商]
  取引先: [主要取引先, 取引先, 仕入先, 販売先, 納入先]
  拠点: [拠点, 事業所, 営業所, 支店, 工場, 海外拠点, 関連会社, グループ会社]

evidence:
  取扱製品: [取扱製品, 製品, 営業品目, 製造品目, 加工品目, 主要製品, ラインナップ]
  取扱材料: [取扱材料, 対応材料, 材質, チタン, マグネシウム, CFRP, 炭素繊維, セラミック, スーパーエンプラ, 樹脂, 複合材]
  一点物・少量多品種: [一点物, 一品物, 単品, 試作, 小ロット, 少量, 多品種, 受注生産, オーダーメイド, 特注, 開発試作, 量産試作]
  製品分野: [医療, 歯科, インプラント, 航空, 宇宙, ロケット, 防衛, 自動車, ブラケット, 治具, 金型, 半導体, ロボット, ドローン]
  AM関連: [3Dプリンタ, 3Dプリンター, 積層造形, アディティブ, AM, 造形, 光造形, 粉末]
  連絡先: [メール, メールアドレス, お問い合わせ, 問い合わせフォーム, contact, mail]

subpage_keywords: [会社概要, 会社案内, 企業情報, 企業概要, 沿革, 事業, 製品, 取扱, サービス, 設備, 加工, 事例, 採用,
  アクセス, お問い合わせ, 問い合わせ, company, about, profile, corporate, business, product, service, contact, mail, pdf]

image_keywords: [概要, gaiyo, outline, 製品, product]

external_queries:
  - "{name} 取扱製品 試作 小ロット"
  - "{name} 会社概要 事業内容"
  - "{name} お問い合わせ メール"

limits: {pages: 30, subpages: 25, pdfs: 8, images: 12, external_per_query: 3}
