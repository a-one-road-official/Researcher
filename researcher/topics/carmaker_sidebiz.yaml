# 少量生産・ハイパーカー・レース車両の会社が、車以外（または他社向け）で何で稼いでいるかを洗い出す。
# 一番よく出てくる稼ぎ方から逆算するため。引用をそのまま並べる（分類・解釈は本人がする）。
title: ハイパーカー・少量生産メーカーの車以外の稼ぎ方（他社向け開発・部品供給・ライセンス・デザイン等）
input: researcher/inputs/carmaker_sidebiz.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  設立: [founded, established, since, 設立, 創業]
  従業員数: [employees, staff, people, 従業員]
  売上高: [revenue, turnover, sales, 売上]

evidence:
  他社向けサービス: [engineering services, consulting, consultancy, contract, for OEMs, for clients, our clients, customers include, on behalf of, development partner, white label, turnkey, design services, 受託, 開発支援]
  部品・技術の供給: [supply, supplier, supplies, component, components, systems, battery, powertrain, chassis, structure, structures, monocoque, composite, carbon fibre, carbon fiber, casting, additive, printed, production for]
  ライセンス・ブランド: [license, licence, licensing, licensed, royalty, IP, patent, brand, merchandise, lifestyle, collaboration, partnership]
  車以外の顧客・産業: [aerospace, aviation, defence, defense, marine, rail, medical, motorsport, sport, bicycle, architecture, consumer, energy, space, robotics, industrial, non-automotive, other industries, beyond automotive]
  レース・ワンメイク: [one-make, spec chassis, series, championship, customer racing, race cars, IndyCar, Formula, LMP, LMDh, GT3, supply all]
  お金の形: [subscription, recurring, annual, per unit, royalty, fee, per car, service contract, maintenance, aftersales, parts sales, 保守]
  売上構成: [revenue, turnover, sales, percent, %, share of, accounts for, majority, division, segment, business unit]
  顧客名: [Ferrari, Lamborghini, Bugatti, Aston Martin, McLaren, Porsche, Audi, BMW, Mercedes, Hyundai, Kia, Toyota, Honda, Nissan, Ford, GM, Stellantis, Airbus, Boeing, Lockheed, NASA, ESA, customers such as]

subpage_keywords: [engineering, services, consulting, technology, technologies, solutions, about, history, company, capabilities, industries, clients, partners, case, projects, aerospace, defence, news, press]

external_queries:
  - "{name} engineering services clients other industries"
  - "{name} revenue turnover employees"
  - "{name} supplies components to OEM"
  - "{name} aerospace defence non-automotive"
  - "{name} licensing technology partnership"

limits: {pages: 25, subpages: 25, pdfs: 6, images: 4, external_per_query: 3}
