# ④顧客目線B：ASTEEDA Executive Salon（2026-11-25〜28 沖縄）に来る経営者
# 正本：docs/customer_eye_4-spec-2026-11-15.md（2026-11-15 田村指示「④顧客目線の調査（MECE）」）
# 設計：docs/customer_eye_4-gap-design-2026-11-15.md（前の出力の失敗型への対応）
# 項目対応：証拠の区分＝仕様の項目1〜9＋この層固有の区分。項目10は集計時に空の区分から質問の形で作る。
# 数字は出典つきで取る。1ソースの数字は第2段で突き合わせるまで確定扱いしない。
kind: market
title: ④顧客目線B：ASTEEDA Executive Salon（2026-11-25〜28 沖縄）に来る経営者
input: researcher/inputs/customer_eye_b.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  項目1_分母: [参加者数, 定員, 登壇者, 出展, 会員数, 申込, 実績, 名]
  項目2_払う困りごと: [資金調達, 事業承継, M&A, 販路拡大, 人材採用, 新規事業, 人脈, 交流]
  項目3_目の高さ: [経営者インタビュー, 会長, 社長, インタビュー, 対談, 講演]
  項目4_比較相手: [経営者コミュニティ, 経営者サロン, 異業種交流会, 商工会議所, 経営者団体, セミナー]
  項目5_選ばれない理由: [不満, 退会, 感想, 口コミ, レビュー, 参加して]
  項目6_聞いてくること: [よくある質問, FAQ, 参加方法, 申込方法, 推薦人, 参加条件]
  項目7_払う額: [参加費, 会費, 年会費, 協賛, スポンサー, 万円]
  項目8_導入後の変化: [マッチング実績, 成約, 提携, 参加者の声, 導入事例, 実績]
  項目9_決め方: [推薦制, 招待制, 審査, 申込, 会員制]
  項目B_参加の形: [エグゼクティブサロン, ビジネスマッチング, ネットワーキング, セッション, 登壇者]

numeric: [項目1_分母, 項目7_払う額]

figure_patterns:
  人数: '項目1_分母|([\d,]+)\s*(?:名|人)'
  金額_万円: '項目7_払う額|([\d,]+)\s*万円'

external_queries:
  - "site:ryukyuasteeda.jp ASTEEDA Executive Salon 2026 登壇 参加"
  - "琉球アスティーダ エグゼクティブサロン 参加費 会費 推薦制 定員"
  - "ASTEEDA Executive Salon 沖縄 経営者 マッチング 実績"
  - "FINCHI 資金調達 マッチング 経営者 利用 仕組み"
  - "沖縄 経営者 サロン 交流会 会費 参加"
  - "{en} ASTEEDA executive salon Okinawa business matching"

limits: {pages: 40, external_per_query: 5, per_cat: 15}
