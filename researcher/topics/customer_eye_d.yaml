# ④顧客目線D：ガソリンスタンド・整備工場のトップ
# 正本：docs/customer_eye_4-spec-2026-11-15.md（2026-11-15 田村指示「④顧客目線の調査（MECE）」）
# 項目対応：証拠の区分＝仕様の項目1〜9。項目10（聞かないと分からないこと）は集計時に空の区分から質問の形で作る（検索では取れない）。
# 出力は事実と数字と出典だけ。どの顧客像を選ぶかは書かない。
kind: market
title: ④顧客目線D：ガソリンスタンド・整備工場のトップ
input: researcher/inputs/customer_eye_d.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  項目D_業界の数字: [SS数, 給油所数, 整備工場数, 認証工場, 指定工場, 全石連, 整備振興会, EV, 需要減少, 廃業]
  項目1_分母: [社数, 事業所数, 軒数, 企業数, 統計, 経済センサス, 業界団体, 会員数, 加盟, 登録数, 人数]
  項目2_払う困りごと: [困りごと, 課題, 人手不足, 後継者, 導入済み, 使っている, 外注, 利用料, 支出, 費用]
  項目3_目の高さ: [インタビュー, 社長, 経営者, 業務, 一日の流れ, ブログ, 密着, 現場]
  項目4_比較相手: [比較, 乗り換え, 料金プラン, 競合, シェア, 選び方]
  項目5_選ばれない理由: [不満, 解約, 返品, トラブル, クレーム, 低評価, レビュー, 失敗, 後悔]
  項目6_聞いてくること: [FAQ, よくある質問, 質問, 導入前, 問い合わせ, Q&A]
  項目7_払う額: [価格, 料金, 月額, 年額, 万円, 単価, プラン]
  項目8_導入後の変化: [導入事例, 導入後, 削減, 効率化, 時間短縮, 売上, 改善]
  項目9_決め方: [前払い, リース, 補助金, 助成金, 決済, 支払い, 稟議, 承認]

numeric: [項目1_分母, 項目7_払う額]

limits: {pages: 40, external_per_query: 5, per_cat: 15}

external_queries:
  - "{name} 数 統計 業界団体"
  - "{name} 経営 課題 インタビュー 後継者 人手不足"
  - "{name} 設備投資 補助金 助成金"
  - "ガソリンスタンド 経営 インタビュー 課題 設備"
  - "自動車整備工場 経営者 課題 人手不足 設備投資"
  - "{en} Japan gas station owners decline EV repair shop"
