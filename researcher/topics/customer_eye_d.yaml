# ④顧客目線D：ガソリンスタンド・整備工場のトップ
# 正本：docs/customer_eye_4-spec-2026-11-15.md（2026-11-15 田村指示「④顧客目線の調査（MECE）」）
# 設計：docs/customer_eye_4-gap-design-2026-11-15.md（前の出力の失敗型への対応）
# 項目対応：証拠の区分＝仕様の項目1〜9＋この層固有の区分。項目10は集計時に空の区分から質問の形で作る。
# 数字は出典つきで取る。1ソースの数字は第2段で突き合わせるまで確定扱いしない。
kind: market
title: ④顧客目線D：ガソリンスタンド・整備工場のトップ
input: researcher/inputs/customer_eye_d.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  項目1_分母: [給油所数, SS数, 整備工場数, 認証工場数, 指定工場数, 事業者数, 統計, 推移]
  項目2_払う困りごと: [ガソリン需要減少, EV化, 後継者不足, 人手不足, 整備士不足, 設備老朽化, 収益悪化, 廃業]
  項目3_目の高さ: [経営者インタビュー, 所長, 社長, インタビュー, 現場, 密着]
  項目4_比較相手: [大手系列, 特約店, 独立系, セルフ, フルサービス, コンビニ併設]
  項目5_選ばれない理由: [廃業, 撤退, 倒産, 不満, 値上げ, クレーム, 減少]
  項目6_聞いてくること: [よくある質問, 導入, 相談, 補助金相談, 問い合わせ]
  項目7_払う額: [設備投資, 補助金, 助成金, 価格, 費用, 万円]
  項目8_導入後の変化: [導入事例, 効率化, 売上, 併設, 多角化, 成功事例]
  項目9_決め方: [補助金, 助成金, 経産省, 国交省, リース, 決裁]
  項目D_業界の数字: [資源エネルギー庁, 全石連, 全国石油商業組合連合会, 日本自動車整備振興会連合会, 自動車整備白書, 石油便覧]

numeric: [項目1_分母, 項目7_払う額]

figure_patterns:
  給油所数: '項目1_分母|(?:給油所数|SS数)[^0-9]{0,20}?([\d,]+)'
  工場数: '項目1_分母|(?:整備工場数|認証工場数|指定工場数)[^0-9]{0,20}?([\d,]+)'
  金額_万円: '項目7_払う額|([\d,]+)\s*万円'

external_queries:
  - "給油所数 推移 資源エネルギー庁 統計 SS数"
  - "自動車整備工場数 認証工場 指定工場 統計 整備振興会"
  - "ガソリンスタンド 経営者 インタビュー 後継者 廃業 課題"
  - "整備工場 経営 課題 整備士不足 設備投資 補助金"
  - "ガソリンスタンド 設備 補助金 助成金 経産省"
  - "{en} Japan gas stations decline statistics auto repair shops number"

limits: {pages: 40, external_per_query: 5, per_cat: 15}
