# 本人の指示（2026-11-04）：最低受注額を1,000万円以上にする前提で、ものづくり企業（中堅以上・オーナーが決める会社）が「年1,000万円以上」を何に払っているかを知り、ベンチマークにする。
# 大野克也の手法：上位プレイヤーを事実だけで並べ、弱みを4軸（遅い・高い/不透明・使いにくい・カバーしていない）で言語化する。だから価格帯・主な提供企業・導入期間・利用者の不満を引用のまま取る。要約しない。
kind: market
title: ものづくり企業が年1,000万円以上を払っている外部サービス — 価格帯・提供企業・不満
input: researcher/inputs/tenm_bench.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  価格帯: [万円, 億円, 初期費用, 年額, 月額, 導入費用, 費用相場, 料金, 見積]
  主な提供企業: [主要企業, 提供企業, ベンダー, 大手, シェア, 比較, おすすめ, ランキング, 導入実績]
  導入期間・支払い: [導入期間, ヶ月, か月, 稼働まで, 契約期間, 年間契約, 支払い, 前払い, 検収]
  不満・失敗: [失敗, 不満, デメリット, 高い, 使いにくい, 遅い, 定着しない, 合わない, 費用対効果, 後悔, 解約, 問題点, 課題]
  成果・効果: [効果, 削減, 向上, 成果, ROI, 費用対効果, 改善, 倍]
  買い手の規模: [中小企業, 中堅企業, 従業員, 規模, 年商, 売上]

numeric: [価格帯]

external_queries:
  - "{name} 費用 相場 万円"
  - "{name} 製造業 導入 費用"
  - "{name} 失敗 デメリット"
  - "{name} 比較 主要企業"
  - "{name} 中堅企業 導入事例 効果"
  - "{name} 導入期間"

limits: {pages: 45, external_per_query: 6, per_cat: 15}
