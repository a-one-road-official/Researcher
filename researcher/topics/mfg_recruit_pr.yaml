# 町工場・中小製造業の採用広報・求人広告：誰がいくらで売っていて、月額か成果報酬か、何社が払い続けているか。
# 有料職業紹介に当たらない形（求人広告＝募集情報等提供）で、成果報酬を取っている例があるか。事実のみ引用。
kind: market
title: 町工場・中小製造業の採用広報・求人広告の売り手と料金（月額・成果報酬・継続）
input: researcher/inputs/mfg_recruit_pr.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  売り手: [株式会社, 合同会社, 運営, 提供, サービス名, 支援実績, 導入実績, 導入企業, 社が導入, company, provider]
  料金: [料金, 価格, 費用, 円, 万円, 初期費用, 月額, 年額, 掲載料, 1本, 制作費, プラン, pricing, price, fee]
  成果報酬・採用課金: [成果報酬, 成功報酬, 採用課金, 採用決定, 採用1名, 応募課金, クリック課金, 後払い, 完全成果, 理論年収, pay per hire, success fee]
  継続・規模: [継続率, 継続, 解約, リピート, 社以上, 社が, 件以上, 掲載社数, 利用社数, 会員, 導入社数]
  効果: [応募数, 応募が, 採用数, 名採用, 人採用, 応募者, 倍, 定着, 離職]
  法的な区分: [募集情報等提供, 職業紹介, 有料職業紹介, 許可番号, 届出, 職業安定法, 特定募集情報等提供]
  採用の困りごと: [人手不足, 採用難, 応募が来ない, 若手, 高齢化, 後継者, 技能継承, 採用費, 採用コスト]

numeric: [料金, 継続・規模, 効果]

external_queries:
  - "{name} 料金 月額"
  - "{name} 成果報酬 採用課金"
  - "{name} 導入実績 社"
  - "{name} 事例 応募数 採用"
  - "{name} 会社 一覧 比較"

limits: {pages: 40, external_per_query: 5, per_cat: 15}
