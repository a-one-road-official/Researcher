# 本人の指示（2026-11-04）：黒崎さんの思考過程を俺流にパクる。第2段＝黒崎さんが確かめた3つの数字（顧客獲得単価・企業が払う単価・マッチング率＝成約率）で利幅を見る。
# 加えて黒崎さんの「許可を待つ間は許可の要らない物を売ってつなぐ」「最初の3か月で突き抜ける」を写し、許可の要否と最初の売上までの期間も取る。
# 候補はA1の入口候補（取材記事・メディア／ホワイトラベルソフト／オンプレAI／海外メーカーの日本窓口／金属AM原料／許可の要らない採用支援／人材紹介）。同じことをしている会社の実数を引用のまま取る。
kind: market
title: 黒崎式・第2段 — 入口候補ごとの3つの数字（獲得単価・払う単価・成約率）と許可・立ち上がり期間
input: researcher/inputs/kurosaki_unit.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  顧客獲得単価: [獲得単価, CPA, CAC, 顧客獲得コスト, 1件あたり, 営業コスト, 広告費, 商談単価, リード単価, cost per acquisition, customer acquisition cost]
  顧客が払う単価: [単価, 料金, 価格, 月額, 年額, 初期費用, 万円, 円, 契約金額, 受注額, 手数料, 成功報酬, 年収の, price, fee]
  成約率・継続率: [成約率, 受注率, 商談化率, マッチング率, 決定率, 継続率, 解約率, チャーン, 更新率, リピート率, conversion rate, win rate, churn, retention]
  利幅: [粗利, 粗利率, 利益率, 営業利益, 原価, マージン, gross margin, margin]
  許可・資格の要否: [許可, 届出, 免許, 資格, 有料職業紹介, 労働者派遣, 登録, 認定, 要件, 資産要件, license]
  最初の売上までの期間: [立ち上げ, 初受注, 最初の売上, ヶ月, か月, 期間, 導入まで, リードタイム, 商談期間, 半年, 1年]
  営業のやり方: [テレアポ, 飛び込み, 紹介, 展示会, 代理店, インバウンド, SEO, ABM, セミナー, ウェビナー, SNS, インフルエンサー, リファラル, アウトバウンド]
  小さく始めた実例: [創業, 1人で, 少人数, 社員数, 従業員, 立ち上げ期, 初年度, 年商, 売上]

numeric: [顧客獲得単価, 顧客が払う単価]

external_queries:
  - "{name} 料金 相場"
  - "{name} 顧客獲得単価 OR CPA"
  - "{name} 成約率 OR 受注率 OR 継続率"
  - "{name} 粗利率 利益率"
  - "{name} 許可 必要"
  - "{name} 起業 立ち上げ 初受注"
  - "{name} 営業方法 紹介 展示会"
  - "{name} 会社 売上 従業員 創業"

limits: {pages: 45, external_per_query: 6, per_cat: 15}
