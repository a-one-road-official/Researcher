# 本人の質問（2026-11-04）：デザイン事務所・建築事務所は日本にどのくらいあるか。キャッシュサイクルが速い（オーナーが1人で決める）買い手の母数を知るため。
# 国の統計（経済センサス・建築士事務所登録数・国勢調査等）の数字を、規模別・都道府県別（特に広島・岡山・愛媛など瀬戸内）で引用のまま取る。要約しない。
kind: market
title: デザイン事務所・建築設計事務所の数 — 規模別・都道府県別
input: researcher/inputs/design_arch_count.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  事業所数・企業数: [事業所数, 企業数, 登録数, 事務所数, 社数, 件数, 登録事務所, establishments, number of firms]
  規模別: [従業者規模別, 従業員規模, 1〜4人, 5〜9人, 10〜19人, 人以下, 人未満, 個人事業, 法人, 規模別]
  都道府県別: [都道府県別, 広島, 岡山, 愛媛, 香川, 山口, 瀬戸内, 中国地方, 四国]
  売上・規模感: [売上高, 売上, 年間売上, 平均, 万円, 億円]
  調査主体・時期: [経済センサス, 国土交通省, 建築士事務所, 統計, 年版, 年度, 調査, 公表]

numeric: [事業所数・企業数]

external_queries:
  - "{name}"
  - "{name} 事業所数 経済センサス"
  - "{name} 都道府県別"
  - "{name} 従業者規模別"
  - "{name} 広島県"
  - "{en}"

limits: {pages: 45, external_per_query: 6, per_cat: 15}
