# 製造業向け採用支援の競合と業界ランドスケープ（第1段：区分ごとに誰がいるか）。老舗・大手から無名のニッチ・小規模まで、
# 会社名・料金体系（月額・成果報酬・応募課金・掲載課金）・規模（売上・社員数・取引社数・登録者数）・創業年・株主の行をそのまま引用する。解釈はしない。
kind: market
title: 製造業向け採用支援の競合ランドスケープ（区分ごとのプレイヤー・料金体系・規模）
input: researcher/inputs/mfg_recruit_land.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  プレイヤー: [株式会社, 運営会社, 運営元, 提供会社, ランキング, おすすめ, 比較, 大手, シェア, 主要, 上位, 社が, providers, companies]
  料金体系: [料金, 費用, 掲載料, 月額, 成果報酬, 採用課金, 応募課金, 掲載課金, 紹介手数料, 年収の, マージン, 初期費用, 万円, 円]
  規模: [売上高, 売上, 営業利益, 従業員, 社員数, 取引社数, 導入社数, 登録者, 会員数, 求人数, 拠点, 上場, 億円]
  創業年度: [設立, 創業, 創立, 年に設立, 年創業, founded]
  株主構成: [株主, 大株主, 筆頭株主, 親会社, 子会社, グループ, 傘下, 出資, 資本提携, 買収, 上場]
  製造業の採用の困りごと: [人手不足, 応募が来ない, 定着, 離職, 有効求人倍率, 採用難, 若手, 技能伝承, 高齢化]

numeric: [規模]

external_queries:
  - "{name} 比較 ランキング"
  - "{name} 会社一覧 運営会社"
  - "{name} 料金 成果報酬 OR 月額 OR 掲載料"
  - "{name} 売上高 OR 取引社数 OR 導入社数"
  - "{name} 業界 シェア 大手"
  - "{name} 小規模 ニッチ 特化"
  - "{name} 設立 株主 親会社"

limits: {pages: 50, external_per_query: 6, per_cat: 20}
