# 製造業、特に地方企業の採用予算：年間採用費、1人あたり採用単価、求人広告費の相場、採用経路の割合、有効求人倍率、補助金。
# 金額・割合・調査対象（地域・社数・時期）の行をそのまま引用する。売り手の料金表は「料金」として分けて残す。解釈はしない。
kind: market
title: 製造業（特に地方企業）の採用予算・採用単価・採用経路
input: researcher/inputs/mfg_hiring_budget.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  採用予算・採用費: [採用費, 採用予算, 採用コスト, 採用にかける, 年間採用, 採用経費, 求人広告費, 広告費, 総額, recruiting budget, recruitment cost, cost per hire]
  1人あたり採用単価: [採用単価, 1人あたり, 一人あたり, 1名あたり, 1名採用, 1人採用, per hire]
  調査対象: [調査対象, 回答, 社を対象, 有効回答, 調査期間, 調査時期, 調査方法, 都道府県, 地域別, 地方, 地域]
  採用経路: [ハローワーク, 学校からの紹介, 学校紹介, 縁故, 紹介, 求人広告, 求人誌, 求人サイト, 人材紹介, 採用経路, 応募経路, Indeed, 求人ボックス]
  人手不足: [有効求人倍率, 人手不足, 充足率, 欠員, 求人倍率, 不足感]
  補助金: [補助金, 助成金, 補助率, 上限, 支援金, 奨励金]
  料金: [料金, 掲載料, 円, 万円, 月額, 成果報酬, 応募課金, 採用課金]

numeric: [採用予算・採用費, 1人あたり採用単価, 人手不足, 補助金, 料金]

figure_patterns:
  採用単価万円: '1人あたり採用単価|(\d{1,4}(?:\.\d)?)\s*万円'
  年間採用費万円: '採用予算・採用費|(\d{1,4}(?:\.\d)?)\s*万円'

external_queries:
  - "{name} 調査 万円"
  - "{name} 平均 2025"
  - "{name} 中小企業 アンケート 結果"
  - "{name} 就職白書 OR マイナビ OR リクルート 調査"
  - "{name} 商工会議所 OR 信用金庫 OR 県 調査"
  - "{name} 都道府県 地方 比較"
  - "{en}"

limits: {pages: 45, external_per_query: 5, per_cat: 15}
