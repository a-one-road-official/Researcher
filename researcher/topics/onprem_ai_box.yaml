# 本人の指示（2026-11-03）：オンプレのAI端末（箱ごと置くハードウェア型）が世界にあるかを洗い尽くす。イスラエルを含め全地域。
# 用途はYomi（町工場の過去メールを社内の箱だけで読ませ、見積・案件概算を答える）。サーバーは自社で作らず担ぐ前提。
# 取るのは：製品名・提供企業・国・価格・1台の利用人数・オフライン/エアギャップ可否・更新方法（USB等）・ホワイトラベル/再販・日本での保守。引用のまま、要約しない。
kind: market
title: オンプレのAI端末（ハードウェア型・ネットから切り離して動くLLM箱）— 提供企業と条件
input: researcher/inputs/onprem_ai_box.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  提供企業・製品名: [AI in a box, AI appliance, LLM appliance, private AI appliance, on-prem AI device, edge AI server, AI box, appliance, launches, introduces, unveils, providers, vendors, companies such as, startup, オンプレAI, AIアプライアンス, AIボックス]
  国・所在地: [Israel, Israeli, Tel Aviv, headquartered, based in, founded in, イスラエル, 本社]
  価格: [per month, /month, per node, price, priced at, costs, starting at, USD, $, €, 月額, 価格, 円]
  利用人数・性能: [users, concurrent, per node, tokens per second, GPU, VRAM, parameters, 70B, 8B, 同時, 人まで]
