# 本人の指示（2026-11-05）：PLEX黒崎さんの記事の型。経済センサス（日本標準産業分類）の産業ごとの大きさを取り、
# ベストベンチャー100の社数と並べて「大きいのにベンチャーが少ない」領域を数字で見る。財布の厚さとして
# 資本金1億円以上の企業数・広告宣伝費・売上も産業別に取る。引用のまま取る。要約・順位づけはしない。
kind: market
title: 経済センサス — 産業大分類ごとの企業数・従業者数・売上（収入）金額・資本金1億円以上の企業数・広告宣伝費
input: researcher/inputs/census_jsic.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  企業数・事業所数: [企業数, 事業所数, 経済センサス, 活動調査, 基礎調査]
  従業者数: [従業者数, 従業員数, 就業者数]
  売上（収入）金額・付加価値額: [売上高, 売上（収入）金額, 売上金額, 付加価値額, 兆円, 億円]
  資本金1億円以上の企業: [資本金1億円以上, 資本金10億円以上, 大企業, 資本金階級, 資本金規模, 法人企業統計]
  広告宣伝費・販管費: [広告宣伝費, 宣伝費, 販売費, 広告費, 売上高比率, 東京商工リサーチ]
  増減・推移: [前回比, 増加, 減少, 推移, 2016年, 2021年, 2026年]

numeric: [企業数・事業所数, 売上（収入）金額・付加価値額]

external_queries:
  - "経済センサス 活動調査 {name} 企業数 売上（収入）金額"
  - "経済センサス 2021 産業大分類 {name} 従業者数"
  - "法人企業統計 {name} 資本金1億円以上 社数"
  - "{name} 広告宣伝費 売上高比率 業種別"
  - "e-Stat 経済センサス {name} 付加価値額"

limits: {pages: 40, external_per_query: 5, per_cat: 12}
