# IR1000本ノック（プレックス黒崎さんの方法）：上場企業のうち営業利益率10%以上の会社を、利益率の高い順に、
# 「誰に・何を・どうやって売り、お金がどう動くか」をIRからそのまま引用する。分類・解釈はしない（本人がする）。
title: IR1000本ノック 営業利益率10%以上の上場企業 誰に・何を・どうやって・お金の動き
build: researcher.build_ir1000
input: researcher/inputs/ir1000.csv
