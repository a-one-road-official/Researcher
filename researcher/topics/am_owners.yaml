# 本人の指示（2026-11-10）：日本で金属AM（PBF：SLMなど）の装置を持っている会社・研究機関＝すでに金属粉を買っている先を洗い出す。
# 製造元は問わない。市場は小さいので水増ししない。第1段（build）で検索から名簿、第2段（ここ）で1社ずつ公式サイトで装置の保有・資本金・創業年度・株主構成を三重確認。
title: 日本の金属AM（PBF）装置の保有者（会社・研究機関）— 保有装置・方式・台数・資本金・創業年度・株主構成
build: researcher.build_am_owners
input: researcher/inputs/am_owners.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  事業内容: [事業内容, 事業概要, 主な事業, 研究分野]
  資本金: [資本金]
  創業年度: [設立, 創業, 創立]
  従業員数: [従業員, 社員数, 職員数]
  売上高: [売上高, 売上, 年商]
  株主: [株主, 主要株主, 出資, 親会社]
  所在地: [所在地, 本社, 住所]
  保有設備: [保有設備, 設備一覧, 主要設備, 設備紹介, 機器一覧, 開放機器, 共用設備]

evidence:
  金属AM装置の保有（型番・製造元・台数・導入年）: [金属3Dプリンタ, 金属3Dプリンター, 金属積層造形, 粉末床溶融結合, パウダーベッド, PBF, SLM, DMLS, 電子ビーム, EBM, レーザー積層, EOS, ニコン, 3D Systems, DMP, Renishaw, レニショー, TruPrint, TRUMPF, Concept Laser, Arcam, GE Additive, LUMEX, 松浦機械, ソディック, OPM, DMG森精機, LASERTEC, 日本電子, JAM-5200, Farsoon, BLT, Velo3D, Xact Metal, AddUp, 導入, 保有, 台数, 号機]
  使っている金属粉（材質）: [チタン, Ti-6Al-4V, Ti64, インコネル, Inconel, ニッケル, IN718, IN625, ステンレス, SUS316L, 316L, 17-4PH, マルエージング, アルミ, AlSi10Mg, 銅, CuCrZr, タングステン, コバルトクロム, 金属粉末, 粉末]
  用途・客の産業: [航空, 宇宙, 防衛, 医療, インプラント, 金型, 自動車, 半導体, エネルギー, 核融合, 試作, 量産, 受託造形, 依頼試験]
  資本金・株主: [資本金, 株主, 出資, 親会社, 上場, 子会社]

figure_patterns:
  資本金(万円): "資本金・株主|資本金\\s*[:：]?\\s*([\\d,\\.]+)\\s*万円"
  資本金(億円): "資本金・株主|資本金\\s*[:：]?\\s*([\\d,\\.]+)\\s*億"

subpage_keywords: [会社概要, 会社情報, 企業情報, 設備, 設備紹介, 保有設備, 設備一覧, 機器, 開放機器, 共用設備, 3Dプリンタ, 積層造形, 沿革, ニュース, お知らせ, about, company, equipment, facility, news]
