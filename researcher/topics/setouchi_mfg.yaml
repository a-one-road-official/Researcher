# 2026-11-06 軸に合わせて品目を直す：痛み・損（深さの印）の欄と検索を先頭に足した。
# 本人の指示（2026-11-05）：瀬戸内（＋全国の町工場）の製造業中小企業を、タウンページ・地元の採用情報・地元の大学/高専の企業説明会の参加企業から洗い、
# マイナビ等の求人の想定年収と突き合わせる。社名は検索で照合したものだけ（build_setouchi_mfg.py）。ここでは1社ずつ公式サイトで採用の出し方を確かめる。事実だけ。
title: 瀬戸内の製造業中小企業 — 採用の出し方（採用ページ・求人媒体・想定年収・採用人数）
build: researcher.build_setouchi_mfg
input: researcher/inputs/setouchi_mfg.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  所在地: [所在地, 本社, 住所, 本店]
  創業年度: [設立, 創業, 創立]
  資本金: [資本金]
  従業員数: [従業員, 社員数, 従業者]
  売上高: [売上高, 売上, 年商]
  事業内容: [事業内容, 事業概要, 営業品目, 製品]
  代表者: [代表者, 代表取締役, 社長]
  主要取引先: [主要取引先, 取引先, 主な納入先, 販売先]

evidence:
  痛み・損（深さの印）: [受注を断, 断った, 断らざるを得, 失注, 機会損失, 稼働停止, 設備が止, ライン停止, 納期遅れ, 受注残, 人手不足倒産, 倒産, 廃業, 欠員, 採用できなかった, 応募がない, 離職, 損失額, 被害額, 億円の損失, 減産, 操業停止, turned down orders, lost orders, backlog, labor shortage, shutdown]
  採用ページ: [採用情報, 採用サイト, リクルート, recruit, 募集要項, エントリー, 新卒採用, 中途採用, キャリア採用]
  想定年収・給与: [年収, 月給, 給与, 初任給, 賞与, 昇給, 万円]
  採用人数: [採用予定, 募集人数, 採用実績, 名採用, 名募集]
  求人媒体: [マイナビ, リクナビ, Wantedly, Indeed, ハローワーク, doda, エン転職, engage, 求人ボックス]
  採用の発信: [社員インタビュー, 先輩社員, 社員紹介, 採用動画, 会社説明会, インターンシップ, 工場見学, ブログ, Instagram, YouTube]
  人手不足の発言: [人手不足, 人材不足, 採用難, 若手, 後継者, 高齢化, 技能継承, 外国人技能実習, 特定技能]
  取引先・規模: [取引先, 納入, マツダ, 造船, 今治造船, 三菱, 川崎, 億円, 拠点, 工場]

figure_patterns:
  想定年収(万円): "想定年収・給与|年収\\s*[:：]?\\s*(\\d{3,4})\\s*万"
  月給(万円): "想定年収・給与|月給\\s*[:：]?\\s*(\\d{2})(?:[.,]\\d+)?\\s*万"
  初任給(円): "想定年収・給与|初任給[^0-9]{0,15}(\\d{3},?\\d{3})\\s*円"
  採用人数(名): "採用人数|(\\d{1,3})\\s*名(?:採用|募集)"

subpage_keywords: [会社概要, 会社案内, 企業情報, 採用, リクルート, 募集要項, 求人, 社員, 沿革, 製品, 設備, recruit, company, about, careers]
image_keywords: [募集, 採用, 概要]

external_queries:
  - "{name} 人手不足 受注 断る"
  - "{name} 受注残 人手不足"
  - "{name} 人手不足 損失 億円"
  - "{name} 求人 年収"
  - "{name} 採用 新卒 高卒"

limits: {pages: 12, subpages: 10, pdfs: 3, images: 3, external_per_query: 3}
