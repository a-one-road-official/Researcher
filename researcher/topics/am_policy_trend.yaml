# 本人の指示（2026-11-07）：「2026年段階での数じゃなくて、集計開始から2026年までの施策の増加率を知りたい」。
# 一社ずつ解く先（業界×会社の大きさ×場面×素材）を判定するための物差し①社数 ②場面の頻度 ③1件の金額 ④お金の出どころ ⑤今の解き方 ⑥決まるまでの長さ を、
# 単年の数ではなく「集計開始の年から2026年まで」の年ごとの推移で取る。増加率（初年→最新の倍率・年平均の伸び）は calc で割り出すので、各年の数字を出典つきで漏れなく拾う。
# 一次を優先：防衛省・防衛装備庁（防衛生産基盤強化法の認定、安全保障技術研究推進制度、防衛白書、予算の概要）、経済産業省・NEDO・TRAFAM（AMの国プロ予算）、
# 内閣府・JAXA（宇宙戦略基金）、中小企業庁（ものづくり補助金の採択）、都産技研などの公設試（機器利用件数）、矢野経済研究所・シード・プランニング（国内3Dプリント市場）、
# 上場企業のIR（リンカーズ、JMC、SOLIZE、ミスミ）、海外はAM Power・Wohlers・米国防総省。引用のまま。要約しない。AMの件数が分かれば必ず別に取る（樹脂・金属・エンプラ・カーボンの内訳も）。
kind: market
title: AMに関わる施策・需要の集計開始から2026年までの推移（増加率の材料）
input: researcher/inputs/am_policy_trend.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈, url: 直接URL}
refresh_hours: 168

evidence:
  件数の推移: [件数, 認定件数, 採択件数, 応募件数, 申請件数, 契約件数, 利用件数, 依頼件数, 社数, 件, 社, 累計]
  金額の推移: [予算, 予算額, 億円, 百万円, 千円, 万円, 事業費, 契約額, 市場規模, 売上高, 前年比, 前年度比, 増加, 減少, 伸び率, 倍]
  AM・3Dプリンタ: [3Dプリンタ, 3Dプリンター, 積層造形, 付加製造, アディティブ, AM, 金属積層, 金属3D, 粉末床, 指向性エネルギー, 試作, additive manufacturing, 3D printing]
  素材の内訳: [金属, チタン, アルミ, 銅, ニッケル, エンプラ, エンジニアリングプラスチック, PEEK, カーボン, CFRP, 炭素繊維, 樹脂]
  場面・目的: [代替, 代わりの調達, サプライチェーン, 撤退, 事業承継, 製造工程の効率化, 供給網の強靱化, 部品の枯渇, 生産終了, 補給, 維持整備, 試作, 新規事業]
  推移: ["2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026", "2027", 推移, 時系列, 年度, 平成, 令和, 創設, 開始, 初年度, 施行, 過去最高]
  期間・審査: [審査, 採択まで, 公募期間, 交付決定, 認定まで, か月, ヶ月, 期間, 締切, 契約まで]
  主体: [防衛省, 防衛装備庁, 経済産業省, 経産省, NEDO, TRAFAM, 中小企業庁, 内閣府, JAXA, 宇宙戦略基金, 都産技研, 公設試, 国防総省, DoD, DLA]

numeric: [件数の推移, 金額の推移]

external_queries:
  - "{name} 推移"
  - "{name} 年度別"
  - "{name} 件数 pdf"
  - "{en}"
limits: {pages: 55, pdfs: 16, external_per_query: 6, per_cat: 24}
