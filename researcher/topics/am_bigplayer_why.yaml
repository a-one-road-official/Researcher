# 本人の指示（2026-11-07）：「伸びてる市場なのに、なんで大手が入れてないのか（あるいは入れてるのか）をもっと掘り下げたい」。
# 日本のAM（樹脂以外：金属・エンプラ・カーボン）の受託・販売・窓口・内製に、大手が「いつ入ったか・いつ出たか・なぜか（本人・会社の発言）」を1社ずつ三重確認。
