# 本人の指示（2026-11-04）：黒崎俊さん（PLEX）の思考過程を俺流にパクる。表面（テレアポ等）ではなく考え方を写す。
# 第1段＝黒崎さんの「経済センサスで全産業を見て、大手プラットフォームがいない×需給の差（需要は増える・働き手は減る）の分野を探す」をA1に写したもの。
# A1の前提：売る先はものづくり企業・デザイン会社・建築事務所。領域は樹脂以外（プラスチック製品は外す）。引用のまま取る。要約・解釈・順位づけはしない。
kind: market
title: 黒崎式・第1段 — 産業ごとの需給の差×大手プラットフォームの不在（A1の売る先の産業）
input: researcher/inputs/kurosaki_scan.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  事業所数・従業者数（経済センサス等）: [事業所数, 企業数, 従業者数, 経済センサス, 工業統計, 経済構造実態調査, 社数, 事業所]
  増減・推移: [増加, 減少, 前年比, 推移, 廃業, 休廃業, 倒産, 新設, 増減]
  需要が増えるか: [需要, 市場規模, 拡大, 増加, 伸び, 成長, 受注, 出荷額, 生産額, 前年比]
  働き手が減るか（人手不足）: [人手不足, 欠員, 有効求人倍率, 高齢化, 後継者, 技能承継, 採用難, 離職, 平均年齢, 就業者数]
  大手プラットフォームの有無: [プラットフォーム, マッチング, 受発注, 一括見積, ポータル, 求人サイト, ミスミ, キャディ, イプロス, リクルート, Indeed, 寡占, シェア, 大手]
  取引のやり方・不便: [電話, FAX, 紹介, 相見積, 見積に時間, 属人, 紙, 商社経由, 外注先, 取引慣行, 多重下請け]
  払う単価の手がかり: [単価, 万円, 外注費, 年間, 費用, 予算, 発注額]

numeric: [事業所数・従業者数（経済センサス等）]

external_queries:
  - "{name} 事業所数 従業者数 経済センサス"
  - "{name} 人手不足 有効求人倍率"
  - "{name} 市場規模 推移"
  - "{name} 休廃業 推移"
  - "{name} マッチング プラットフォーム"
  - "{name} 受発注 課題 電話 FAX"
  - "{name} 外注 費用 相場"

limits: {pages: 40, external_per_query: 5, per_cat: 12}
