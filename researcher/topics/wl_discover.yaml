# 本人の指摘「ホワイトラベル企業はそんなに少なくないはず」を受けた網羅調査。A1の領域（樹脂以外の製造業・6分野・3本柱）の41品目ごとに、
# 自社名で再販・OEM・組込みできるソフトの提供企業名と条件の行をそのまま引用する。前職と同じ仕事（図面管理・図面読み取り）と自作する見積窓口は入れない。
kind: market
title: ホワイトラベルで担げるソフトの網羅（製造業・AM・CAD・バッテリー・燃料・素材・航空宇宙）— 提供企業と再販条件
input: researcher/inputs/wl_discover.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  提供企業: [white label partner, white-label platform, white label solution, white-label software, providers, vendors, platforms like, alternatives, competitors, key players, leading, top, companies such as]
  自社名で出せる条件: [white label, white-label, whitelabel, rebrand, your brand, your own brand, your logo, custom domain, private label, OEM, unbranded, embedded, ホワイトラベル, OEM提供, 自社ブランド]
  再販制度: [reseller, resell, partner program, channel partner, distributor, VAR, value-added reseller, revenue share, wholesale, margin, 代理店, 再販, 販売パートナー]
  黒字・収益性: [profitable, profitability, profit, EBITDA, net income, operating income, operating profit, cash-flow positive, cash flow positive, break-even, breakeven, bootstrapped, self-funded, in the black, 黒字, 営業利益, 純利益, 経常利益, 利益率]
  売上: [revenue, ARR, annual recurring, sales of, turnover, million in revenue, 売上, 売上高, 年商]
  価格: [per month, /month, per user, per seat, pricing, license fee, plans start, starting at, 月額, 年額, ライセンス料]
  日本対応: [Japan, Japanese, 日本, 日本語, 国内代理店, Japanese distributor]

numeric: [売上, 価格]

figure_patterns:
  売上USD: '売上|(?:revenue|ARR|turnover)[^0-9$€]{0,30}?(?:USD|US\$|\$|€)\s*(\d{1,4}(?:[.,]\d{1,3})?)\s*(?:billion|million|bn|mn|m\b|M\b)'

external_queries:
  - "white label {en}"
  - "{en} white-label"
  - "best white label {en} providers"
  - "{en} rebrand your logo own brand"
  - "{en} private label OEM partner"
  - "{en} reseller white label program"
  - "{en} embed SDK license OEM"
  - "{en} white label company profitable"

limits: {pages: 60, external_per_query: 5, per_cat: 15}
