# ④顧客目線C：卓上3Dプリンターのクラファン支援者（Makuake・CAMPFIRE・Kickstarter・GREEN FUNDING）
# 正本：docs/customer_eye_4-spec-2026-11-15.md（2026-11-15 田村指示「④顧客目線の調査（MECE）」）
# 設計：docs/customer_eye_4-gap-design-2026-11-15.md（前の出力の失敗型への対応）
# 項目対応：証拠の区分＝仕様の項目1〜9＋この層固有の区分。項目10は集計時に空の区分から質問の形で作る。
# 数字は出典つきで取る。1ソースの数字は第2段で突き合わせるまで確定扱いしない。
kind: market
title: ④顧客目線C：卓上3Dプリンターのクラファン支援者（Makuake・CAMPFIRE・Kickstarter・GREEN FUNDING）
input: researcher/inputs/customer_eye_c.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  項目1_分母: [プロジェクト数, 支援者数, 流通総額, 成功率, カテゴリ, 実績]
  項目2_払う困りごと: [欲しい, 自作, 造形, 失敗, 時間, 置き場所, 騒音, 臭い]
  項目3_目の高さ: [支援者, バッカー, 購入者, ユーザー, レビュー動画, インタビュー]
  項目4_比較相手: [Amazon, 楽天, ヨドバシ, 直販, 公式ストア, 比較, 並行輸入]
  項目5_選ばれない理由: [遅延, 発送遅れ, 不良, 故障, 返金, 返品, 不満, クレーム, 炎上]
  項目6_聞いてくること: [質問, コメント, FAQ, 技適, PSE, 保証, サポート, 日本語マニュアル]
  項目7_払う額: [支援額, 価格, 早割, スーパー早割, リターン, 円, ドル]
  項目8_導入後の変化: [到着, 開封, 使ってみた, レビュー, 満足, 造形品質, 感想]
  項目9_決め方: [クレジットカード, 決済, 支払い, キャンセル, 支援方法, コンビニ払い]
  項目C_支援の形: [支援総額, 目標金額, 達成率, 残り, パトロン, コレクション]

numeric: [項目1_分母, 項目7_払う額, 項目C_支援の形]

figure_patterns:
  支援総額_円: '項目C_支援の形|支援総額[^0-9]{0,10}?([\d,]+)\s*円'
  支援者数: '項目C_支援の形|支援者[^0-9]{0,10}?([\d,]+)\s*人'
  達成率: '項目C_支援の形|([\d,]+)\s*[%％]'

external_queries:
  - "Makuake 3Dプリンター プロジェクト 支援総額 支援者数"
  - "CAMPFIRE 3Dプリンター 支援総額 支援者"
  - "GREEN FUNDING 3Dプリンター 支援総額"
  - "site:kickstarter.com 3D printer backers pledged"
  - "卓上3Dプリンター クラウドファンディング 遅延 不満 コメント"
  - "{en} desktop 3D printer crowdfunding backers pledged delay complaints reviews"

limits: {pages: 40, external_per_query: 5, per_cat: 15}
