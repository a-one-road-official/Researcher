# 本人の指示（2026-11-07）：A1メディアを作る前に、AI系メディア・戦略17分野系メディア・船井総研などの集客回路がどういう構造か、
# A1が写せるところと写せないところを見極める。論点：規模の経済で勝っていて再現できないのか、需要そのものをメディアが押さえていて入れないのか。
# 1社ずつ三重確認で事実だけ：①読者・見込み客がどこから来るか（検索・SNS・展示会・紹介・無料セミナー・本）
# ②誰がお金を払うか（広告主・読者の購読・会員費・セミナー参加費・資料請求1件ごとの送客料・成約手数料）と単価
# ③何が積み上がって後発を阻んでいるか（記事数・会員名簿・編集部の人数・親会社の顧客基盤・ドメインの古さ）
# ④立ち上げ時：最初の読者・最初の売上をどう作ったか（創業者・編集長インタビュー）。創業年度・株主構成も必ず。解釈しない。
