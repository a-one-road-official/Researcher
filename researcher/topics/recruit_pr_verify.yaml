# 本人の指示（2026-11-04）：「中堅製造業向けの採用広報（採用サイト＋技術者の取材記事）が入口に一番合う」という仮説を、検証できる根拠と定量の事実まで落とす。
# 確かめること：⓪本人の仮説「製造業は営業よりも採用に困っている」（経営課題の調査で人材確保と販路開拓・受注不足の順位と割合、雇用人員判断DI、人手不足倒産、人手不足で受注を断った割合を規模別に）、①中堅製造業は何社あるか（規模別）②どれだけ採用に困っているか（職種別の有効求人倍率など公的統計）③採用にいくら払っているか（規模別・業種別の採用費）④採用サイト・採用広報にいくら払うか（規模別の相場・製造業の発注事例）⑤続けて払うか（運用・更新の月額や継続契約）⑥作る側の原価（取材ライター・撮影の外注単価）⑦どう買われるか（紹介・展示会・比較サイト・飛び込み）⑧製造業に特化した採用広報の会社が実在し、どれくらいの規模か。
# 一次情報（厚生労働省、総務省・経済産業省の統計、就職みらい研究所・マイナビ・dodaなどの調査PDF、上場企業の開示）を優先。引用のまま取る。要約・解釈しない。数字の入っていない行は捨てる区分あり。
kind: market
title: 仮説の検証 — 中堅製造業向け採用広報：社数・採用難・採用費・採用広報の単価・継続・原価・買い方・前例
input: researcher/inputs/recruit_pr_verify.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  社数（規模別）: [事業所数, 企業数, 社数, 従業者規模, 常用雇用者規模, 100～299人, 300～999人, 100人以上, 中堅企業, 経済センサス]
  採用難（公的統計）: [有効求人倍率, 求人倍率, 充足率, 欠員率, 未充足, 人手不足, 採用できなかった, 計画を下回, 職業別]
  採用にいくら払うか: [採用費, 採用コスト, 採用単価, 1人あたり, 年間, 平均, 万円, 総額, 広告費, 紹介手数料]
  採用広報・採用サイトの単価: [採用サイト, 採用ホームページ, 採用広報, 社員インタビュー, 取材記事, 採用動画, 採用パンフレット, 制作費, 料金, 相場, 万円]
  継続して払うか: [月額, 運用, 更新, 保守, 継続, 年間契約, リピート, 契約継続率, 追加発注]
  作る側の原価: [ライター, 文字単価, 1本あたり, 取材費, 撮影費, カメラマン, 編集費, 外注費, 原稿料]
  どう買われるか: [紹介, 展示会, 比較サイト, 問い合わせ, 相見積, 既存取引, 地元, 商工会, 金融機関, 飛び込み, テレアポ, 決裁, 社長, 人事部]
  営業と採用のどちらに困っているか: [経営課題, 経営上の課題, 最大の課題, 人材確保, 人材不足, 人手不足, 販路開拓, 売上不振, 受注不足, 需要の停滞, 営業力, 顧客開拓, 回答割合, 上位, 1位, 2位, 雇用人員判断DI, 人手不足倒産, 受注を断, 機会損失]
  前例の会社（製造業特化）: [製造業特化, 製造業専門, ものづくり企業専門, メーカー専門, 町工場, 工場, 製造業向け, 株式会社, 売上, 従業員, 創業, 設立]

numeric: [営業と採用のどちらに困っているか, 社数（規模別）, 採用難（公的統計）, 採用にいくら払うか, 採用広報・採用サイトの単価, 作る側の原価]

figure_patterns:
  有効求人倍率: '採用難（公的統計）|有効求人倍率[^0-9]{0,15}(\d{1,2}\.\d{1,2})\s*倍'
  万円: '採用広報・採用サイトの単価|(\d{1,4}(?:,\d{3})?(?:\.\d)?)\s*万円'

external_queries:
  - "{name}"
  - "{name} 調査 PDF"
  - "{name} 厚生労働省"
  - "{name} 規模別 万円"
  - "{name} 製造業 事例"
  - "{name} 2025 OR 2026"

limits: {pages: 50, pdfs: 10, external_per_query: 6, per_cat: 15}
