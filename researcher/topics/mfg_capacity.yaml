# 本人の指示（2026-11-05）：ものづくりの受託加工をする全部の会社について、平均社員数・受注金額（加工賃収入・売上）・ケイパビリティに対する生産能力を金額で割り出し（1人あたり・1社あたり・設備1台あたり）、ここ10年（2015〜2025年）で上がっているか下がっているかを、複数の情報源を走査して作る。
# 「製造業」で一括りにしない。工法（業種）ごと・従業者規模ごとに分かれた数字を取る。一次情報（経済産業省 工業統計・経済構造実態調査の「加工賃収入額」「従業者数」「事業所数」、総務省 経済センサス、中小企業庁 中小企業実態基本調査、各工業会の統計、上場・非上場企業の開示）を優先。年ごとの値を引用のまま取る。要約・解釈しない。
kind: market
title: 受託加工の生産能力 — 業種・規模別の平均社員数・受注額（加工賃収入）・1人あたり金額の10年推移
input: researcher/inputs/mfg_capacity.csv
columns: {name: 品目, en: 英語名, aliases: 別名, context: 文脈}

evidence:
  事業所数・社数: [事業所数, 企業数, 社数, 会員数, 従業者規模, 4～9人, 10～19人, 20～29人, 30～99人, 100～299人, 300人以上]
  社員数・平均社員数: [従業者数, 従業員数, 常用労働者, 1事業所当たり従業者, 平均従業者, 平均従業員, 社員数, 人]
  受注金額・加工賃収入: [加工賃収入額, 加工賃, 賃加工, 受注額, 受注高, 生産額, 出荷額, 製造品出荷額等, 売上高, 売上, 億円, 百万円, 万円]
  1人あたり・1社あたり金額: [1人当たり, 一人当たり, 従業者1人当たり, 1事業所当たり, 1社当たり, 労働生産性, 付加価値額, 付加価値生産性, 万円]
  生産能力・設備: [生産能力, 設備台数, 保有台数, 稼働率, 操業度, 設備投資, 有形固定資産, 生産能力指数, 稼働率指数, 機械台数]
  10年推移: ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", 推移, 前年比, 増加, 減少, 時系列, 10年]
  人手と仕事の差: [受注残, 受注を断, 人手不足, 外注, 機会損失, 納期, 繁忙, 余力]

numeric: [社員数・平均社員数, 受注金額・加工賃収入, 1人あたり・1社あたり金額, 事業所数・社数, 生産能力・設備]

external_queries:
  - "{name}"
  - "{name} 推移"
  - "{name} 統計 PDF"
  - "{name} 経済構造実態調査 OR 工業統計"
  - "{name} 従業者規模別"
  - "{name} 1人当たり 万円"
  - "{name} 2015 2025"
  - "{en} Japan statistics"

limits: {pages: 55, pdfs: 12, external_per_query: 6, per_cat: 18}
