# 本人の指示（2026-11-04）：製造業の採用領域の前例を1社ずつ。製造業に特化した採用会社（全国）と、瀬戸内（広島・岡山・山口・愛媛・香川）の地場の採用支援・採用サイト制作会社の実数。創業年度と株主構成は必ず取る。事実だけ。
title: 製造業の採用領域の前例 — 製造業特化の採用会社と瀬戸内の地場の採用支援会社
input: researcher/inputs/mfg_recruit_cos.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  創業年度: [設立, 創業, 創立, 設立年, Founded, Established]
  株主: [株主, 主要株主, 大株主, 株主構成, 出資者, 親会社]
  資本金: [資本金]
  従業員数: [従業員, 社員数, 従業者]
  売上高: [売上高, 売上, 年商]
  事業内容: [事業内容, 事業概要, サービス]
  許認可: [許可, 有料職業紹介, 労働者派遣, 届出]
  代表者: [代表者, 代表取締役, 社長]

evidence:
  株主構成: [株主, 大株主, 主要株主, 出資, 親会社, 資本提携, 上場, 子会社]
  創業年度: [設立, 創業, 創立, 年に設立, 年創業]
  売上・規模: [売上, 億円, 百万円, 従業員, 名, 拠点, 取引社数, 導入社数]
  料金: [料金, 価格, 費用, 万円, 月額, 成功報酬, 手数料]
  製造業の顧客: [製造業, メーカー, 工場, 町工場, 導入事例, 取引先, 顧客]
  売り方: [紹介, 展示会, セミナー, 金融機関, 商工会, 提携, テレアポ, 営業, 代理店]
  採用・人数: [採用, 募集, 営業職, 名採用, 中途]
  発言: [代表, 社長, インタビュー, 語る]

subpage_keywords: [会社概要, 会社案内, 企業情報, 沿革, サービス, 料金, 事例, 実績, 採用, ニュース, IR, about, company, service, case, recruit]
image_keywords: [概要, 料金, 実績]

external_queries:
  - "{name} 株主 OR 出資 OR 親会社"
  - "{name} 設立 OR 創業"
  - "{name} 売上高 OR 年商"
  - "{name} 製造業 導入事例"
  - "{name} 料金"
  - "{name} 社長 インタビュー"

limits: {pages: 30, subpages: 25, pdfs: 6, images: 6, external_per_query: 3}
