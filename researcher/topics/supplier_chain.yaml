# 本人の指示（2026-11-07）：Freemelt・6K Additive・MX3D とのディールを決めに行くために、
# 各社の顧客と、その顧客の1次・2次・3次請けをひたすら洗い出す。洗い出した会社には「業界の情報や素材について取材・PR記事を出したい」と取材依頼する。
# 第1段（このテーマ）：供給元3社の顧客・導入先・共同開発先・販売代理店（日本含む）を、事例・プレスリリース・決算資料・展示会・論文・政府契約から1社ずつ事実で取る。
# 第2段（supplier_chain_tier）：第1段で名前が出た顧客ごとに、その下請け（1次〜3次）を公開情報で辿る。第1段の結果を inputs/supplier_chain_tier.csv に入れて回す。
# 防衛・核融合の下請けは非公開が多い。公開情報で辿れた所まで。事実だけ引用、解釈しない。
title: 供給元（Freemelt・6K・MX3D）の顧客・導入先・代理店（日本含む）
input: researcher/inputs/supplier_chain.csv
columns: {name: 社名, url: 公式URL, aliases: 別名, context: 文脈}

profile_keys:
  創業年度: [Founded, Established, founded in, 設立, 創業]
  株主: [Shareholders, Ownership, Owner, Investors, backed by, major shareholders, 株主]
  従業員数: [Employees, employees, 従業員]
  所在地: [Headquarters, HQ, Location]
  売上高: [Revenue, Net sales, Turnover, 売上]
  代表者: [CEO, Founder, 代表]

evidence:
  顧客・導入先: [customer, customers, client, installed at, installation, delivered to, order from, received an order, purchase order, signed, contract with, agreement with, selected by, partnered with, partnership, collaboration, joint development, case study, success story, user, 導入, 納入, 受注, 顧客, 採用]
  用途・分野: [fusion, tungsten, plasma-facing, medical, implant, orthopedic, defense, defence, military, aerospace, space, rocket, engine, turbine, aircraft carrier, navy, naval, submarine, nuclear, semiconductor, energy, oil and gas, maritime, shipbuilding, 核融合, 医療, 防衛, 航空, 宇宙, 船]
  政府・研究機関の契約: [Department of Defense, DoD, US Navy, Air Force, Army, DARPA, AFRL, ONR, NAVAIR, DLA, ITER, EUROfusion, UKAEA, Fusion for Energy, ESA, NASA, Horizon Europe, grant, funding, SBIR, contract award, 契約, 助成]
  日本との接点: [Japan, Japanese, Tokyo, Osaka, distributor in Japan, Japanese partner, 日本, 代理店, 販売店, 総代理店, reseller, distributor, sales partner, agent]
  販売の仕組み: [distributor, reseller, sales partner, channel partner, agent, exclusive, non-exclusive, representation, 代理店, 独占]
  規模・受注残: [order backlog, order intake, net sales, revenue, units sold, installed base, machines sold, systems delivered, 受注残, 台数]
  株主構成: [shareholders, ownership, largest shareholders, major shareholders, owned by, parent company, investors, backed by, stake]
  創業年度: [founded in, established in, was founded, since 20, since 19]
  黒字・資金: [EBITDA, operating loss, net loss, profit, cash, funding round, raised, Series, rights issue, private placement, 赤字, 黒字]

subpage_keywords: [customers, case, case-studies, applications, industries, news, press, media, investors, ir, reports, annual, partners, distributors, resellers, about, company, fusion, medical, defense, defence, aerospace, japan]
image_keywords: [customer, case, partner, logo]

external_queries:
  - "{name} customer OR order OR \"received an order\""
  - "{name} case study OR \"success story\""
  - "{name} partnership OR collaboration OR \"joint development\""
  - "{name} defense OR navy OR \"Department of Defense\" contract"
  - "{name} fusion OR medical OR aerospace customer"
  - "{name} Japan OR Japanese OR 日本 代理店"
  - "{name} annual report customers order backlog"
  - "{name} distributor OR reseller OR \"sales partner\""
  - "{name} 導入 OR 納入 OR 受注"

limits: {pages: 40, subpages: 30, pdfs: 12, images: 6, external_per_query: 6}
